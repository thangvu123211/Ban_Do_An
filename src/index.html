<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Bán Đồ Ăn</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/Logo/TA.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>

  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDWz0hIbdR6O-UAf-q7Gy3LkSF0u9cOpTw&libraries=places">
  </script>
</head>

<body class="relative">
  <!-- Splash screen nằm ngoài app-root -->
  <div id="splash-screen" class="fixed inset-0 flex flex-col items-center justify-center z-[9999]
         bg-gradient-to-br from-green-50 via-green-100 to-green-50">

    <!-- Logo rất lớn -->
    <img src="assets/Logo/FoodHub.png" class="w-80 h-80 md:w-52 md:h-52 object-contain drop-shadow-md animate-pulse"
      alt="Logo" />

    <!-- Loader minimal -->
    <div class="mt-10 flex items-center space-x-2">
      <div class="w-3 h-3 bg-green-600 rounded-full animate-bounce"></div>
      <div class="w-3 h-3 bg-green-500 rounded-full animate-bounce [animation-delay:150ms]"></div>
      <div class="w-3 h-3 bg-green-400 rounded-full animate-bounce [animation-delay:300ms]"></div>
    </div>

    <!-- Text lớn hơn -->
    <p class="mt-7 text-green-700 text-lg font-semibold tracking-wide">
      Đang khởi động hệ thống...
    </p>

    <p class="text-green-500 text-sm mt-1">
      Vui lòng chờ trong giây lát
    </p>
  </div>

  <!-- Angular app -->
  <app-root></app-root>
</body>

</html>
