<nav class="hidden md:block fixed top-20 left-0 h-[calc(100vh-5rem)] shadow-xl transition-all duration-300"
  [ngClass]="collapsed ? 'w-20' : 'w-64'">
  

  <!-- NAVIGATION -->
  <div class="flex-1 overflow-y-auto px-2 py-5">
    <ul class="space-y-2">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="[item.link]" routerLinkActive="active-link" matTooltip="{{ collapsed ? item.text : '' }}"
          matTooltipPosition="right"
          class="flex items-center gap-3 px-3 py-2 rounded-full hover:bg-gray-800 hover:text-white transition-all duration-100 ease-in-out">
          <!-- ICON luôn hiển thị -->
          <mat-icon class="flex-shrink-0">{{ item.icon }}</mat-icon>

          <!-- CHỮ ẩn/mở -->
          <span class="overflow-hidden transition-all duration-300 whitespace-nowrap">
            {{ item.text }}
          </span>
        </a>
      </li>

    </ul>
  </div>

  <!-- FOOTER -->
  <div class="px-4 py-3 border-t border-gray-700 text-sm text-gray-400 text-center">
    © 2025 FRESH FOOD
  </div>
</nav>

<div *ngIf="sidebarService.mobileOpen$ | async"
     class="fixed inset-0 z-[10000] md:hidden">

  <!-- BACKDROP -->
  <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"
       (click)="sidebarService.closeMobile()"></div>

  <!-- DRAWER -->
  <div class="absolute left-0 top-0 h-full w-80 bg-white shadow-2xl
              flex flex-col animate-slide">

    <!-- HEADER -->
    <div class="flex items-center justify-between px-4 py-4 border-b">

      <div class="flex items-center gap-3">
        <img src="assets/Logo/FoodHub.png"
             class="h-8 w-8 rounded-full object-cover" />

        <div class="leading-tight">
          <p class="text-sm font-semibold">Admin Panel</p>
          <p class="text-xs text-gray-500">Fresh Food</p>
        </div>
      </div>

      <button mat-icon-button (click)="sidebarService.closeMobile()">
        <mat-icon>close</mat-icon>
      </button>

    </div>

    <!-- MENU -->
    <div class="flex-1 overflow-y-auto px-3 py-4 space-y-1">

      <a *ngFor="let item of menuItems"
         [routerLink]="item.link"
         (click)="sidebarService.closeMobile()"
         class="flex items-center gap-3 px-3 py-3 rounded-xl
                text-gray-700 hover:bg-gray-100 active:bg-gray-200
                transition">

        <mat-icon class="text-gray-600">{{ item.icon }}</mat-icon>

        <span class="text-sm font-medium">
          {{ item.text }}
        </span>

      </a>

    </div>

    <!-- FOOTER -->
    <div class="px-4 py-3 border-t text-xs text-gray-400 text-center">
      © 2025 Fresh Food
    </div>

  </div>
</div>
