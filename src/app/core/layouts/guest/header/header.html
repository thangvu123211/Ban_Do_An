<div class="bg-gray-200 text-sm py-2 px-6 md:px-12 flex justify-between items-center fixed top-0 w-full z-[60]">
    <div>
        Hotline đặt bàn:
        <span class="font-semibold">0933924075</span>
        <span class="ml-1">(8:30–21:30, tất cả các ngày trong tuần)</span>
    </div>
    <a [routerLink]="['/lienhe']" class="hover:underline">Liên hệ</a>
</div>

<!-- 🔹 Header chính (ngay dưới, dính luôn top bar) -->
<mat-toolbar
    class="custom-toolbar mat-elevation-z6 fixed w-full z-50 px-6 md:px-16 py-4 flex items-center justify-between"
    style="top: 0; margin-top: 32px;">

    <!-- Logo -->
    <div class="flex items-center mt-3">
        <img src="assets/Logo/logomoi4.png" alt="Logo" class="h-[145px] md:h-[190px] w-auto" />
    </div>

    <!-- Menu trung tâm -->
    <nav class="hidden md:flex items-center justify-center gap-8 text-lg font-semibold  tracking-wide"
        style="font-family: 'Inter', sans-serif;">

        <a [routerLink]="['/home']"
            class="relative cursor-pointer hover:text-yellow-400 transition-colors duration-300 after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-0.5 after:bg-yellow-400 after:transition-all after:duration-300 hover:after:w-full">
            Trang chủ
        </a>

        <a [routerLink]="['/blog']"
            class="relative cursor-pointer hover:text-yellow-400 transition-colors duration-300 after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-0.5 after:bg-yellow-400 after:transition-all after:duration-300 hover:after:w-full">
            Thông tin
        </a>

        <a [routerLink]="['/lienhe']"
            class="relative cursor-pointer hover:text-yellow-400 transition-colors duration-300 after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-0.5 after:bg-yellow-400 after:transition-all after:duration-300 hover:after:w-full">
            Liên hệ
        </a>

        <a [routerLink]="['/datban']"
            class="relative cursor-pointer hover:text-yellow-400 transition-colors duration-300 after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-0.5 after:bg-yellow-400 after:transition-all after:duration-300 hover:after:w-full">
            Đặt bàn
        </a>

        <a [routerLink]="['/thucdon']"
            class="relative cursor-pointer hover:text-yellow-400 transition-colors duration-300 after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-0.5 after:bg-yellow-400 after:transition-all after:duration-300 hover:after:w-full">
            Đặt giao hàng
        </a>

    </nav>




    <!-- Icons bên phải -->
    <div class="flex items-center gap-4 mr-6">
        <button mat-icon-button matTooltip="Tìm kiếm">
            <mat-icon>search</mat-icon>
        </button>

        <button mat-icon-button matTooltip="Trang cá nhân" class="tooltipne" (click)="goToUserPage()">
            <mat-icon>person</mat-icon>
        </button>

        <button mat-icon-button matTooltip="Giỏ hàng" [matBadge]="tongSoMon" matBadgeColor="warn"
            [matBadgeHidden]="tongSoMon === 0" (click)="moGioHang()">
            <mat-icon>shopping_cart</mat-icon>
        </button>

        <button mat-icon-button matTooltip="Thông báo">
            <mat-icon>notifications_active</mat-icon>
        </button>
    </div>
</mat-toolbar>
