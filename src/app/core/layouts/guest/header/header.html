<!-- 🔹 Top bar -->
<div class="bg-gray-100 text-sm py-2
            md:fixed md:top-0 w-full z-[60] text-gray-700">
  <div class="max-w-7xl mx-auto px-4 md:px-6 flex justify-between items-center">
    <div>
      Hotline đặt bàn:
      <span class="font-semibold text-gray-900">0933924075</span>
      <span class="ml-1">(8:30–21:30, tất cả các ngày trong tuần)</span>
    </div>

    <a [routerLink]="['/lienhe']" class="relative text-gray-800
             after:absolute after:left-0 after:-bottom-1
             after:w-0 after:h-[2px] after:bg-green-600
             after:transition-all after:duration-300
             hover:after:w-full hover:text-green-600">
      Liên hệ
    </a>
  </div>
</div>

<!-- 🔹 Header chính -->
<mat-toolbar class="custom-toolbar mat-elevation-z6
         w-full z-50 bg-white
         md:fixed" style="top: 32px">

  <!-- ================= MOBILE MENU ================= -->


  <!-- KHUNG GIỮA -->
  <div class="max-w-7xl mx-auto w-full px-4 md:px-6
              flex items-center justify-between">

    <!-- Logo -->
    <div class="flex items-center">
      <a routerLink="/" class="flex items-center">
        <img src="assets/Logo/FoodHub.png" alt="Logo" class="h-[35px] md:h-[50px] w-auto cursor-pointer" />
      </a>
    </div>

    <!-- Menu -->
    <nav class="hidden md:flex items-center gap-8
             text-lg font-semibold tracking-wide
             text-gray-800" style="font-family: 'Inter', sans-serif">

      <a [routerLink]="['/home']" class="nav-item">Trang chủ</a>
      <a [routerLink]="['/blog']" class="nav-item">Thông tin</a>
      <a [routerLink]="['/datban']" class="nav-item">Đặt bàn</a>
      <a [routerLink]="['/lienhe']" class="nav-item">Liên hệ</a>
      <a [routerLink]="['/thucdon']" class="nav-item">Thực đơn</a>

    </nav>

    <!-- Icons -->
    <div class="flex items-center gap-4 text-gray-700">

      <button mat-icon-button matTooltip="Trang cá nhân" class="hover:text-green-600" (click)="goToUserPage() ; closeMobileMenu()">
        <mat-icon>person</mat-icon>
      </button>

      <button mat-icon-button matTooltip="Giỏ hàng" [matBadge]="cartBadgeCount " matBadgeColor="warn"
        [matBadgeHidden]="cartBadgeCount  === 0" class="hover:text-green-600" (click)="moGioHang() ; closeMobileMenu()">
        <mat-icon>shopping_cart</mat-icon>
      </button>

      <button mat-icon-button matTooltip="Trang yêu thích" [matBadge]="(tongYeuThich$ | async) || null"
        [matBadgeHidden]="(tongYeuThich$ | async) === 0" matBadgeColor="warn" class="hover:text-green-600"
        (click)="moYeuThich() ; closeMobileMenu()">
        <mat-icon>favorite</mat-icon>
      </button>

      <button *ngIf="isMobile" mat-icon-button class="md:hidden hover:text-green-600" (click)="isMobileMenuOpen = !isMobileMenuOpen">
        <mat-icon>menu</mat-icon>
      </button>

    </div>

  </div>
</mat-toolbar>

<div *ngIf="isMobileMenuOpen" class="absolute left-0 right-0 mt-1.5
            mx-4
            bg-white shadow-xl border z-[9999]
            rounded-xl overflow-hidden">

  <div class="flex flex-col text-sm text-gray-700">

    <span (click)="go('/home')" class="px-4 py-3 hover:bg-gray-100 cursor-pointer">
      Trang chủ
    </span>

    <span (click)="go('/blog')" class="px-4 py-3 hover:bg-gray-100 cursor-pointer">
      Thông tin
    </span>

    <span (click)="go('/datban')" class="px-4 py-3 hover:bg-gray-100 cursor-pointer">
      Đặt bàn
    </span>

    <span (click)="go('/thucdon')" class="px-4 py-3 hover:bg-gray-100 cursor-pointer">
      Thực đơn
    </span>

    <span (click)="go('/lienhe')" class="px-4 py-3 hover:bg-gray-100 cursor-pointer">
      Liên hệ
    </span>

  </div>

</div>

<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type">
</app-toast-message>
