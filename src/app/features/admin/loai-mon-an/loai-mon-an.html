

<div class="relative h-80 flex items-center px-10 bg-white">
  <div>
    <h1 class="text-4xl font-bold mb-3 text-gray-800">
      TRANG QUẢN LÝ MÓN ĂN
    </h1>
    <p class="text-gray-600 max-w-xl">
       Đây là trang quản lý loại món ăn. Bạn có thể thêm, sửa hoặc xóa thông tin nhân viên tại đây.
    </p>
  </div>
</div>


<div class="container mx-auto px-6 mt-10">

    <mat-card class="w-full shadow-xl rounded-2xl p-6">

        <!-- HEADER -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">

            <h3 class="text-2xl font-semibold">
                Danh Sách Loại Món Ăn
            </h3>

            <button mat-flat-button (click)="ThemLoaiMonAn()">
                Thêm Mới
            </button>
        </div>
        <!-- TABLE -->
        <div class="overflow-x-auto">
            <table class="min-w-full border rounded-lg overflow-hidden text-sm">

                <thead class="text-sm">
                    <tr>
                        <th class="px-4 py-3 text-center border">Mã loại</th>
                        <th class="px-4 py-3 text-center border">Ảnh loại món ăn</th>
                        <th class="px-4 py-3 text-center border">Tên loại món ăn</th>
                        <th class="px-4 py-3 text-center border">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let LoaiMonAn of loaimonan; let i = index">
                        <td class="px-4 py-7 text-center border">{{ LoaiMonAn.ma_loai_mon_an }}</td>
                        <td class="px-4 py-7 text-center border">
                            <img *ngIf="LoaiMonAn.anh_loai_mon_an_url" [src]="LoaiMonAn.anh_loai_mon_an_url"
                                alt="Ảnh loại món ăn" class="w-14 h-14 rounded-full object-cover mx-auto shadow" />
                            <span *ngIf="!LoaiMonAn.anh_loai_mon_an_url" class="text-gray-500 italic">Không có
                                ảnh</span>
                        </td>
                        <td class="px-4 py-7 text-center border">{{ LoaiMonAn.ten_loai_mon_an }}</td>
                        <td class="px-4 py-7 text-center border">
                            <div class="flex justify-center gap-2">
                                <button mat-icon-button matTooltip="Sửa" (click)="SuaLoaiMonAn(LoaiMonAn.ma_loai_mon_an)">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <!-- <button mat-icon-button matTooltip="Xóa" (click)="openDialogXoa(LoaiMonAn.ma_loai_mon_an)">
                                    <mat-icon>delete</mat-icon>
                                </button> -->
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </mat-card>
</div>


<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>
