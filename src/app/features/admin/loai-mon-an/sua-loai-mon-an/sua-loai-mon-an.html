<form #editLoaiForm="ngForm" class="relative p-6">

  <!-- Nút đóng -->
  <div class="flex justify-end">
    <button matIconButton type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Tiêu đề -->
  <h2 class="text-2xl font-semibold mb-8 text-center">
    Chỉnh sửa thông tin loại món ăn
  </h2>

  <div class="flex gap-8 flex-wrap lg:flex-nowrap">

    <!-- Ảnh -->
    <div class="flex flex-col items-center gap-3 w-full lg:w-1/3">

      <div class="w-48 h-48 rounded-lg overflow-hidden shadow-md">
        <img [src]="previewImage || 'assets/user.jpg'"
             class="w-full h-full object-cover" />
      </div>

      <button matButton="filled" type="button" (click)="fileInput.click()">
        <mat-icon>upload</mat-icon>
        Thay ảnh
      </button>

      <input #fileInput type="file"
             hidden
             accept="image/*"
             (change)="onFileSelected($event)" />
    </div>

    <!-- FORM -->
    <div class="grid grid-cols-1 gap-4 flex-1">

      <!-- TÊN LOẠI MÓN ĂN -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Tên loại món ăn</mat-label>

        <input matInput
               [(ngModel)]="LoaiMonAn.ten_loai_mon_an"
               name="ten_loai_mon_an"
               required
               minlength="2"
               #tenLoai="ngModel" />

        <!-- REQUIRED -->
        <mat-error *ngIf="tenLoai.touched && tenLoai.errors?.['required']">
          Tên loại món ăn không được để trống
        </mat-error>

        <!-- MIN LENGTH -->
        <mat-error *ngIf="tenLoai.touched && tenLoai.errors?.['minlength']">
          Tối thiểu 2 ký tự
        </mat-error>

      </mat-form-field>

    </div>
  </div>

  <!-- BUTTON -->
  <div class="flex justify-end gap-4 mt-8">

    <button matButton="filled" type="button" (click)="CapNhatLoaiMonAn()" [disabled]="editLoaiForm.invalid || isLoading">

        <mat-icon *ngIf="!isLoading">check</mat-icon>
        <mat-icon *ngIf="isLoading" class="animate-spin">refresh</mat-icon>

        {{ isLoading ? 'Đang cập nhật loại món ăn...' : 'Cập nhật loại món ăn' }}

      </button>

    

    <button mat-raised-button type="button" (click)="close()">
      <mat-icon>close</mat-icon>
      Hủy
    </button>

  </div>

</form>
