
<div class="relative
            h-auto md:h-80
            flex items-center
            px-4 md:px-10
            py-6 md:py-0
            bg-white">

    <div>
        <h1 class="text-2xl md:text-4xl font-bold mb-2 md:mb-3 text-gray-800">
            QUẢN LÝ BÌNH LUẬN VÀ ĐÁNH GIÁ
        </h1>

        <p class="text-sm md:text-base text-gray-600 max-w-xl">
            Danh sách các bình luận và đánh giá có trong cửa hàng của bạn.
        </p>
    </div>
</div>

<div class="p-8 grid grid-cols-1 md:grid-cols-3 gap-6">
  <div *ngFor="let m of monAns"
       class="bg-white rounded-2xl shadow hover:shadow-lg transition cursor-pointer"
       (click)="open(m)">

    <img [src]="m.anh_mon_an?.[0]?.url || 'assets/no-image.png'"
         class="h-44 w-full object-cover rounded-t-2xl" />

    <div class="p-4 space-y-2">
      <h3 class="font-bold text-lg text-gray-800">{{ m.ten_mon_an }}</h3>

      <div class="flex gap-3 text-sm text-gray-500">
        <span>💬 {{ m.so_binh_luan }} bình luận</span>
        <span>⭐ {{ m.so_danh_gia }} đánh giá</span>
      </div>
    </div>
  </div>
</div>
<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>
