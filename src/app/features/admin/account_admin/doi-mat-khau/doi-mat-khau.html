<div class="relative p-6 rounded-2xl shadow-2xl">
  <!-- Nút đóng -->
  <div class="flex justify-end">
    <button matIconButton (click)="close()" class="text-center">
      <mat-icon>close</mat-icon>
    </button>
  </div>


  <!-- Tiêu đề -->
  <h2 class="text-2xl font-semibold mb-8 text-center">
    Đổi mật khẩu
  </h2>

  <div class="flex gap-8 flex-wrap lg:flex-nowrap">

    <!-- Form nhập thông tin -->
    <div class="grid grid-cols-1 gap-4 flex-1">
      <!-- Họ tên -->
      <div class="flex flex-col gap-2 ">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Mật khẩu</mat-label>
          <input matInput placeholder="Nhập mật khẩu mới" [(ngModel)]="admin.mat_khau_moi" name="mat_khau">
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- Nút hành động -->
  <div class="flex justify-end gap-4 mt-8">
    <!-- Button Thêm mới -->
    <button matButton="filled" (click)="doiMatKhau()">
      <mat-icon>check</mat-icon>
      Đổi mật khẩu
    </button>

    <button mat-raised-button (click)="close()">
      <mat-icon>close</mat-icon>
      Hủy
    </button>
  </div>
</div>
