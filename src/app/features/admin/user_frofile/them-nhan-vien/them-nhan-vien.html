<div class="relative flex flex-col max-h-[90vh] bg-white">

  <!-- ================= HEADER ================= -->
  <div class="flex justify-between items-center p-3 border-b bg-white sticky top-0 z-10">
    <h2 class="text-lg sm:text-xl font-semibold">
      Thêm Mới Người Dùng
    </h2>

    <button mat-icon-button type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- ================= CONTENT (SCROLL) ================= -->
  <form #nvForm="ngForm" class="flex-1 overflow-y-auto p-3 sm:p-6">

    <div class="flex flex-col lg:flex-row gap-6 lg:gap-8">

      <!-- ===== UPLOAD ẢNH ===== -->
      <div class="flex flex-col items-center gap-3 w-full lg:w-1/3">
        <div class="w-full h-36 sm:h-48 border-2 border-dashed rounded-lg cursor-pointer
                 flex items-center justify-center" (click)="chonAnh(fileInput)">
          <ng-container *ngIf="!previewUrl; else daCoAnh">
            <div class="flex flex-col items-center">
              <mat-icon class="text-2xl text-cyan-400">cloud_upload</mat-icon>
              <p class="text-sm text-gray-400">Chưa chọn ảnh</p>
            </div>
          </ng-container>

          <ng-template #daCoAnh>
            <img [src]="previewUrl" class="w-full h-full object-cover rounded-lg" />
          </ng-template>
        </div>

        <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelected($event)" />
      </div>

      <!-- ===== FORM ===== -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 flex-1">

        <!-- HỌ TÊN -->
        <mat-form-field appearance="outline">
          <mat-label>Họ tên</mat-label>
          <input matInput [(ngModel)]="NhanVien.ho_ten" name="ho_ten" required minlength="2" #hoTen="ngModel" />
          <mat-error *ngIf="hoTen.touched && hoTen.errors?.['required']">
            Họ tên không được để trống
          </mat-error>
          <mat-error *ngIf="hoTen.touched && hoTen.errors?.['minlength']">
            Họ tên phải ≥ 2 ký tự
          </mat-error>
        </mat-form-field>

        <!-- EMAIL -->
        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" [(ngModel)]="NhanVien.email" name="email" required email #email="ngModel" />
          <mat-error *ngIf="email.touched && email.errors?.['required']">
            Email không được để trống
          </mat-error>
          <mat-error *ngIf="email.touched && email.errors?.['email']">
            Email không đúng định dạng
          </mat-error>
        </mat-form-field>

        <!-- GIỚI TÍNH + NGÀY SINH -->
        <div class="grid grid-cols-2 gap-3 col-span-full">
          <mat-form-field appearance="outline">
            <mat-label>Giới tính</mat-label>
            <mat-select [(ngModel)]="NhanVien.gioi_tinh" name="gioi_tinh" required #gioiTinh="ngModel">
              <mat-option value="Nam">Nam</mat-option>
              <mat-option value="Nữ">Nữ</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Ngày sinh</mat-label>
            <input matInput [matDatepicker]="picker" [(ngModel)]="NhanVien.ngay_sinh" name="ngay_sinh" required
              [max]="maxNgaySinh" />
            <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>

        <!-- LOẠI + SĐT -->
        <div class="grid grid-cols-2 gap-3 col-span-full">
          <mat-form-field appearance="outline">
            <mat-label>Loại người dùng</mat-label>
            <mat-select [(ngModel)]="NhanVien.loai_nguoi_dung" name="loai_nguoi_dung" required>
              <mat-option value="admin">Admin</mat-option>
              <mat-option value="user">User</mat-option>
              <mat-option value="shipper">Shipper</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Số điện thoại</mat-label>
            <input matInput [(ngModel)]="NhanVien.sdt" name="sdt" required pattern="^0[0-9]{9}$" />
          </mat-form-field>
        </div>

        <!-- MẬT KHẨU -->
        <mat-form-field appearance="outline" class="sm:col-span-2">
          <mat-label>Mật khẩu</mat-label>
          <input matInput type="password" [(ngModel)]="NhanVien.mat_khau" name="mat_khau" required minlength="6" />
        </mat-form-field>

        <!-- TRẠNG THÁI -->
        <mat-form-field appearance="outline" class="sm:col-span-2">
          <mat-label>Trạng thái tài khoản</mat-label>
          <mat-select [(ngModel)]="NhanVien.trang_thai" name="trang_thai" required>
            <mat-option value="hoat_dong">Đang hoạt động</mat-option>
            <mat-option value="khoa">Khóa tài khoản</mat-option>
          </mat-select>
        </mat-form-field>

      </div>
    </div>
  </form>

  <!-- ================= FOOTER ================= -->
  <div class="border-t bg-white p-3 flex gap-3 justify-end sticky bottom-0">
    <button mat-raised-button type="button" (click)="close()" class="w-full sm:w-auto">
      Hủy
    </button>

    <button matButton="filled" type="button" (click)="addNhanVien()" [disabled]="nvForm.invalid || loading"
      class="w-full sm:w-auto flex items-center gap-2">
      <mat-icon *ngIf="loading" class="animate-spin">refresh</mat-icon>
      <mat-icon *ngIf="!loading">check</mat-icon>
      {{ loading ? 'Đang thêm...' : 'Thêm mới' }}
    </button>
  </div>

</div>
