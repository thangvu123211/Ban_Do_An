<div class="relative flex flex-col h-[90dvh] bg-white">

  <!-- Header -->
  <div class="flex justify-between items-center p-3 border-b bg-white sticky top-0 z-10">
    <h2 class="text-lg sm:text-xl font-semibold">
      Chỉnh sửa thông tin người dùng
    </h2>

    <button mat-icon-button type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form #editForm="ngForm" class="flex flex-col h-full min-h-0">

    <!-- BODY -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6">

      <!-- CONTAINER CENTER DESKTOP -->
      <div class="max-w-5xl mx-auto">

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

          <!-- AVATAR -->
          <div class="flex flex-col items-center gap-4">

            <div class="w-32 h-32 sm:w-40 sm:h-40 lg:w-48 lg:h-48 rounded-xl overflow-hidden shadow bg-gray-100">
              <img [src]="previewImage || 'assets/user.jpg'"
                   class="w-full h-full object-cover" />
            </div>

            <button matButton="filled" type="button"
                    class="w-full sm:w-auto px-4"
                    (click)="fileInput.click()">
              <mat-icon>upload</mat-icon>
              <span class="ml-1">Thay ảnh</span>
            </button>

            <input #fileInput type="file" hidden
                   (change)="onFileSelected($event)" accept="image/*" />
          </div>

          <!-- FORM -->
          <div class="lg:col-span-2">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

              <!-- Họ tên -->
              <mat-form-field appearance="outline" class="w-full">
                <mat-label>Họ tên</mat-label>
                <input matInput [(ngModel)]="NhanVien.ho_ten"
                       name="ho_ten" required minlength="2"
                       #hoTen="ngModel" />
                <mat-error *ngIf="hoTen.touched && hoTen.errors?.['required']">
                  Họ tên không được để trống
                </mat-error>
                <mat-error *ngIf="hoTen.touched && hoTen.errors?.['minlength']">
                  Họ tên phải ≥ 2 ký tự
                </mat-error>
              </mat-form-field>

              <!-- Giới tính -->
              <mat-form-field appearance="outline" class="w-full">
                <mat-label>Giới tính</mat-label>
                <mat-select [(ngModel)]="NhanVien.gioi_tinh"
                            name="gioi_tinh" required #gioiTinh="ngModel">
                  <mat-option value="Nam">Nam</mat-option>
                  <mat-option value="Nữ">Nữ</mat-option>
                </mat-select>
              </mat-form-field>

              <!-- Ngày sinh -->
              <mat-form-field appearance="outline" class="w-full">
                <mat-label>Ngày sinh</mat-label>
                <input matInput [matDatepicker]="picker"
                       [(ngModel)]="NhanVien.ngay_sinh"
                       name="ngay_sinh" required
                       [max]="maxNgaySinh"
                       #ngaySinh="ngModel" />
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>

              <!-- Email -->
              <mat-form-field appearance="outline" class="w-full">
                <mat-label>Email</mat-label>
                <input matInput [(ngModel)]="NhanVien.email"
                       name="email" required email />
              </mat-form-field>

              <!-- Loại user -->
              <mat-form-field appearance="outline" class="w-full">
                <mat-label>Loại người dùng</mat-label>
                <mat-select [(ngModel)]="NhanVien.loai_nguoi_dung"
                            name="loai_nguoi_dung" required>
                  <mat-option value="admin">Admin</mat-option>
                  <mat-option value="user">User</mat-option>
                  <mat-option value="shipper">Shipper</mat-option>
                </mat-select>
              </mat-form-field>

              <!-- SĐT -->
              <mat-form-field appearance="outline" class="w-full">
                <mat-label>Số điện thoại</mat-label>
                <input matInput [(ngModel)]="NhanVien.sdt"
                       name="sdt" required pattern="^0[0-9]{9}$" />
              </mat-form-field>

              <!-- Mật khẩu -->
              <mat-form-field appearance="outline" class="w-full md:col-span-2">
                <mat-label>Mật khẩu</mat-label>
                <input matInput type="password"
                       [(ngModel)]="NhanVien.mat_khau_moi"
                       name="mat_khau_moi" />
              </mat-form-field>

              <!-- Trạng thái -->
              <mat-form-field appearance="outline" class="w-full md:col-span-2">
                <mat-label>Trạng thái tài khoản</mat-label>
                <mat-select [(ngModel)]="NhanVien.trang_thai"
                            name="trang_thai" required>
                  <mat-option value="khoa">Bị khóa</mat-option>
                  <mat-option value="hoat_dong">Hoạt động</mat-option>
                </mat-select>
              </mat-form-field>

            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="border-t bg-white p-3 flex justify-end gap-3 sticky bottom-0">

      <button matButton="filled"
              type="button"
              (click)="capNhatNhanVien()"
              [disabled]="editForm.invalid || loading"
              class="flex items-center gap-2">
        <mat-icon *ngIf="loading" class="animate-spin">refresh</mat-icon>
        <mat-icon *ngIf="!loading">check</mat-icon>
        {{ loading ? 'Đang cập nhật...' : 'Cập nhật' }}
      </button>

      <button mat-raised-button type="button" (click)="close()">
        <mat-icon>close</mat-icon>Hủy
      </button>

    </div>

  </form>
</div>
