<div class="relative p-6 ">
  <!-- Nút đóng -->
  <button (click)="close()" class="absolute right-3 top-3 text-white hover:text-red-500 transition-colors duration-200">
    <mat-icon>close</mat-icon>
  </button>

  <!-- Tiêu đề -->
  <h2 class="text-2xl font-semibold mb-8 text-center">
    Chỉnh sửa thông tin nhân viên
  </h2>

  <div class="flex gap-8 flex-wrap lg:flex-nowrap">
    <!-- Ảnh nhân viên + upload -->
    <div class="flex flex-col items-center gap-3 w-full lg:w-1/3">
      <div class="w-48 h-48 rounded-lg overflow-hidden shadow-md">
        <img [src]="previewImage || 'assets/user.jpg'" alt="Ảnh nhân viên" class="w-full h-full object-cover" />
      </div>

      <button matButton="filled" (click)="fileInput.click()">
        <mat-icon>upload</mat-icon> Thay ảnh
      </button>

      <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <!-- Form nhập thông tin -->
    <div class="grid grid-cols-2 gap-4 flex-1">
      <!-- Họ tên -->
      <div class="flex flex-col gap-1">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Họ Tên</mat-label>
          <input matInput [(ngModel)]="NhanVien.ho_ten">
        </mat-form-field>
      </div>

      <!-- Giới tính -->
      <div class="flex flex-col gap-1">

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Giới tính</mat-label>
          <mat-select [(ngModel)]="NhanVien.gioi_tinh">
            <mat-option value="Nam">Nam</mat-option>
            <mat-option value="Nữ">Nữ</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Ngày sinh -->
      <div class="flex flex-col gap-1">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Ngày sinh</mat-label>

          <input matInput [matDatepicker]="picker" [(ngModel)]="NhanVien.ngay_sinh" />

          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- Địa chỉ -->
      <div class="flex flex-col gap-1">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Địa chỉ</mat-label>
          <input matInput [(ngModel)]="NhanVien.dia_chi">
        </mat-form-field>
      </div>

      <!-- Email -->
      <div class="flex flex-col gap-1">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="NhanVien.email" placeholder="example@email.com" autocomplete="off">
        </mat-form-field>
      </div>

      <!-- Mật khẩu -->
      <div class="flex flex-col gap-1">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Mật khẩu</mat-label>
          <input matInput [(ngModel)]="NhanVien.mat_khau_moi" autocomplete="new-password">
        </mat-form-field>
      </div>

      <!-- Loại nhân viên -->
      <div class="flex flex-col gap-1 col-span-2">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Loại nhân viên</mat-label>
          <mat-select [(ngModel)]="NhanVien.loai_nguoi_dung">
            <mat-option value="admin">Admin</mat-option>
            <mat-option value="user">User</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
  </div>

  <!-- Nút hành động -->
  <div class="flex justify-end gap-4 mt-8">
    <!-- Button Thêm mới -->

    <button matButton="filled" (click)="capNhatNhanVien()">
      <mat-icon >check</mat-icon> Cập nhật
    </button>

    <!-- Button Hủy -->
    <button mat-raised-button (click)="close()">
      <mat-icon >close</mat-icon>Hủy
    </button>
  </div>
</div>
