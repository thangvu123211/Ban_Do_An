<!-- HEADER -->
<div class="relative h-96 flex items-center justify-start px-10">
  <div class="z-10">
    <h1 class="text-5xl font-bold mb-4">Hello Admin</h1>
    <p class="text-lg max-w-lg">
      Đây là trang quản lý bàn ăn. Bạn có thể thêm, sửa hoặc xóa thông tin bàn ăn tại đây.
    </p>

    <button matButton="filled" (click)="ThemBanAn()" class="px-4 py-2">
      Thêm Mới bàn ăn
    </button>
  </div>
</div>

<!-- KHUNG DỮ LIỆU -->
<div class="container mx-auto px-6 mt-10">

  <mat-card class="w-full shadow-xl rounded-2xl p-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6 border-b pb-4">

      <h3 class="text-2xl font-semibold">
        Danh Sách Bàn Ăn
      </h3>

      <button mat-flat-button (click)="ThemBanAn()">
        Thêm mới
      </button>
    </div>

    <!-- TABLE -->
    <div class="overflow-x-auto">
      <table class="min-w-full border rounded-lg overflow-hidden text-sm">

        <thead class="text-sm">
          <tr>
            <th class="px-4 py-4 text-center border">STT</th>
            <th class="px-4 py-4 text-center border">Ảnh bàn</th>
            <th class="px-4 py-4 text-center border">Tên Bàn</th>
            <th class="px-4 py-4 text-center border">Số Chỗ Ngồi</th>
            <th class="px-4 py-4 text-center border">Trạng Thái</th>
            <th class="px-4 py-4 text-center border">Hành động</th>
          </tr>
        </thead>

        <tbody>

          <tr *ngFor="let items of BanAn; let i = index">

            <td class="px-4 py-4 text-center border">{{ i + 1 }}</td>

            <!-- Ảnh bàn -->
            <td class="px-4 py-4 text-center border">
              <img *ngIf="items.anh_ban?.length > 0" [src]="items.anh_ban[0].url" alt="Ảnh bàn"
                class="w-12 h-12 rounded-full object-cover mx-auto shadow" />

              <span *ngIf="!items.anh_ban || items.anh_ban.length === 0" class="text-gray-500 italic">
                Không có ảnh
              </span>
            </td>

            <td class="px-4 py-4 text-center border">{{ items.ten_ban }}</td>
            <td class="px-4 py-4 text-center border">{{ items.so_cho_ngoi }}</td>

            <!-- Trạng thái -->
            <td class="px-4 py-4 text-center border">
              <span *ngIf="items.trang_thai == 1"
                class="inline-block bg-green-600 text-white font-semibold text-sm px-2 py-1 rounded-full shadow">
                Còn bàn
              </span>

              <span *ngIf="items.trang_thai == 0"
                class="inline-block bg-red-600 text-white font-semibold text-sm px-2 py-1 rounded-full shadow">
                Hết bàn
              </span>
            </td>

            <!-- ACTION BUTTONS -->
            <td class="px-4 py-4 text-center border">
              <div class="flex justify-center gap-2">

                <!-- Sửa -->
                <button mat-icon-button matTooltip="Sửa" (click)="SuaBanAn(items.ma_ban)">
                  <mat-icon>edit</mat-icon>
                </button>

                <!-- Xóa -->
                <button mat-icon-button matTooltip="Xóa" (click)="XoaBanAn(items.ma_ban)">
                  <mat-icon>delete</mat-icon>
                </button>

              </div>
            </td>

          </tr>

        </tbody>

      </table>
    </div>

  </mat-card>

</div>


<!-- TOAST -->
<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>
