<div class="relative p-6 rounded-2xl shadow-2xl">
  <!-- Nút đóng -->
  <div class="flex justify-end">
    <button matIconButton (click)="close()" class="flex items-center ">
      <mat-icon>
        close
      </mat-icon>
    </button>
  </div>


  <!-- Tiêu đề -->
  <h2 class="text-2xl font-semibold mb-8 text-center">
    Thêm Mới Bàn Ăn
  </h2>

  <div class="flex gap-8 flex-wrap lg:flex-nowrap">
    <!-- Upload ảnh -->
    <div class="flex flex-col items-center gap-3 w-full lg:w-1/3">
      <div
        class="w-full h-48 border-2 border-dashed cursor-pointer hover:border-cyan-400 transition overflow-hidden relative flex items-center justify-center"
        (click)="chonAnh(fileInput)">
        <ng-container *ngIf="!previewUrl; else daCoAnh">
          <div class="flex flex-col items-center justify-center">
            <mat-icon class="text-2xl mb-2 text-cyan-400 leading-none">cloud_upload</mat-icon>
            <p class="text-sm font-medium text-gray-400">Chưa chọn ảnh</p>
          </div>
        </ng-container>
        <ng-template #daCoAnh>
          <img [src]="previewUrl" alt="Preview" class="w-full h-full object-cover rounded-lg" />
        </ng-template>
      </div>

      <div class="text-xs text-gray-400 mt-2 text-center italic">
        Hỗ trợ: JPEG, JPG, PNG &nbsp; | &nbsp; Dung lượng tối đa: 25MB
      </div>

      <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <!-- Form nhập -->
    <div class="grid grid-cols-1 gap-4 flex-1">
      <!-- Tên Bàn Ăn -->
      <div class="flex flex-col gap-1">

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>
            Tên bàn
          </mat-label>
          <input matInput [(ngModel)]="BanAn.ten_ban" name="ten_ban" placeholder="Nhập tên bàn ăn" />
        </mat-form-field>
      </div>

      <!-- Trạng Thái -->
      <div class="flex flex-col gap-1">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Trạng thái</mat-label>
          <mat-select [(ngModel)]="BanAn.trang_thai" name="trang_thai">
            <mat-option value="0">Hết bàn</mat-option>
            <mat-option value="1">Còn bàn</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Số Chỗ Ngồi -->
      <div class="flex flex-col gap-1">
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Số chỗ ngồi</mat-label>
          <mat-select [(ngModel)]="BanAn.so_cho_ngoi" name="so_cho_ngoi">
            <mat-option *ngFor="let n of seatNumbers" [value]="n">{{n}} chỗ</mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>


  </div>

  <!-- Nút hành động -->
  <div class="flex justify-end gap-4 mt-8">
    <button matButton="filled" (click)="addBanAn()" [disabled]="isLoading"
      class="flex items-center gap-2 justify-center">
      <mat-icon *ngIf="isLoading" class="animate-spin">
        refresh
      </mat-icon>

      <mat-icon *ngIf="!isLoading">
        check
      </mat-icon>

      <span>
        {{ isLoading ? 'Đang thêm...' : 'Thêm mới' }}
      </span>
    </button>

    <button mat-raised-button (click)="close()">
      <mat-icon>close</mat-icon>
      Hủy
    </button>
  </div>
</div>
