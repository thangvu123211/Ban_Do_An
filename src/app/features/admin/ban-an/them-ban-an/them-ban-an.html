<form #banAnForm="ngForm" class="relative p-6 rounded-2xl shadow-2xl">

  <!-- ===== NÚT ĐÓNG ===== -->
  <div class="flex justify-end">
    <button matIconButton type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- ===== TIÊU ĐỀ ===== -->
  <h2 class="text-2xl font-semibold mb-8 text-center">
    Thêm Mới Bàn Ăn
  </h2>

  <div class="flex gap-8 flex-wrap lg:flex-nowrap">

    <!-- ===== UPLOAD ẢNH ===== -->
    <div class="flex flex-col items-center gap-3 w-full lg:w-1/3">

      <div class="w-full h-48 border-2 border-dashed cursor-pointer flex items-center justify-center"
        (click)="chonAnh(fileInput)">

        <ng-container *ngIf="!previewUrl; else daCoAnh">
          <div class="flex flex-col items-center">
            <mat-icon class="text-2xl mb-2 text-cyan-400">cloud_upload</mat-icon>
            <p class="text-sm text-gray-400">Chưa chọn ảnh</p>
          </div>
        </ng-container>

        <ng-template #daCoAnh>
          <img [src]="previewUrl" class="w-full h-full object-cover rounded-lg" />
        </ng-template>

      </div>

      <input #fileInput type="file" hidden accept="image/*" (change)="onFileSelected($event)" />
    </div>

    <!-- ===== FORM ===== -->
    <div class="grid grid-cols-1 gap-4 flex-1">

      <!-- TÊN BÀN -->
      <mat-form-field appearance="outline">
        <mat-label>Tên bàn</mat-label>

        <input matInput name="ten_ban" [(ngModel)]="BanAn.ten_ban" required minlength="2" #tenBan="ngModel" />

        <mat-error *ngIf="tenBan.touched && tenBan.errors?.['required']">
          Tên bàn không được để trống
        </mat-error>

        <mat-error *ngIf="tenBan.touched && tenBan.errors?.['minlength']">
          Tên bàn phải từ 2 ký tự
        </mat-error>
      </mat-form-field>

      <!-- TRẠNG THÁI -->
      <mat-form-field appearance="outline">
        <mat-label>Trạng thái</mat-label>

        <mat-select name="trang_thai" [(ngModel)]="BanAn.trang_thai" required #trangThai="ngModel">

          <mat-option [value]="1">Còn bàn</mat-option>
          <mat-option [value]="0">Hết bàn</mat-option>

        </mat-select>

        <mat-error *ngIf="trangThai.touched && trangThai.errors?.['required']">
          Vui lòng chọn trạng thái
        </mat-error>
      </mat-form-field>

      <!-- SỐ CHỖ NGỒI -->
      <mat-form-field appearance="outline">
        <mat-label>Số chỗ ngồi</mat-label>

        <mat-select name="so_cho_ngoi" [(ngModel)]="BanAn.so_cho_ngoi" required #soCho="ngModel">

          <mat-option *ngFor="let n of seatNumbers" [value]="n">
            {{ n }} chỗ
          </mat-option>

        </mat-select>

        <mat-error *ngIf="soCho.touched && soCho.errors?.['required']">
          Vui lòng chọn số chỗ ngồi
        </mat-error>
      </mat-form-field>

    </div>
  </div>

  <!-- ===== ACTION ===== -->
  <div class="flex justify-end gap-4 mt-8">

    <button matButton="filled" type="button" (click)="addBanAn()" [disabled]="banAnForm.invalid || isLoading">

      <mat-icon *ngIf="!isLoading">check</mat-icon>
      <mat-icon *ngIf="isLoading" class="animate-spin">refresh</mat-icon>

      {{ isLoading ? 'Đang thêm...' : 'Thêm mới' }}

    </button>

    <button mat-raised-button type="button" (click)="close()">
      <mat-icon>close</mat-icon>
      Hủy
    </button>

  </div>

</form>
