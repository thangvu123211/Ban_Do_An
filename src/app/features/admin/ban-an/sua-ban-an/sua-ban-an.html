<form #editBanForm="ngForm" class="relative p-6">

  <!-- Nút đóng -->
  <div class="flex justify-end">
    <button matIconButton type="button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Tiêu đề -->
  <h2 class="text-2xl font-semibold mb-8 text-center">
    Chỉnh sửa thông tin bàn ăn
  </h2>

  <div class="flex gap-8 flex-wrap lg:flex-nowrap">

    <!-- Ảnh -->
    <div class="flex flex-col items-center gap-3 w-full lg:w-1/3">

      <div class="w-48 h-48 rounded-lg overflow-hidden shadow-md">
        <img [src]="previewImage || 'assets/user.jpg'"
             class="w-full h-full object-cover" />
      </div>

      <button matButton="filled" type="button" (click)="fileInput.click()">
        <mat-icon>upload</mat-icon>
        Thay ảnh
      </button>

      <input #fileInput type="file"
             hidden
             accept="image/*"
             (change)="onFileSelected($event)" />
    </div>

    <!-- FORM -->
    <div class="grid grid-cols-1 gap-4 flex-1">

      <!-- TÊN BÀN -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Tên bàn</mat-label>

        <input matInput
               name="ten_ban"
               [(ngModel)]="banAn.ten_ban"
               required
               minlength="2"
               #tenBan="ngModel" />

        <mat-error *ngIf="tenBan.touched && tenBan.errors?.['required']">
          Tên bàn không được để trống
        </mat-error>

        <mat-error *ngIf="tenBan.touched && tenBan.errors?.['minlength']">
          Tên bàn phải từ 2 ký tự
        </mat-error>
      </mat-form-field>

      <!-- SỐ CHỖ NGỒI -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Số chỗ ngồi</mat-label>

        <input matInput
               type="number"
               name="so_cho_ngoi"
               [(ngModel)]="banAn.so_cho_ngoi"
               required
               min="1"
               #soCho="ngModel" />

        <mat-error *ngIf="soCho.touched && soCho.errors?.['required']">
          Vui lòng nhập số chỗ ngồi
        </mat-error>

        <mat-error *ngIf="soCho.touched && soCho.errors?.['min']">
          Số chỗ ngồi phải lớn hơn 0
        </mat-error>
      </mat-form-field>

      <!-- TRẠNG THÁI -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>Trạng thái</mat-label>

        <mat-select name="trang_thai"
                    [(ngModel)]="banAn.trang_thai"
                    required
                    #trangThai="ngModel">

          <mat-option [value]="1">Còn bàn</mat-option>
          <mat-option [value]="0">Hết bàn</mat-option>

        </mat-select>

        <mat-error *ngIf="trangThai.touched && trangThai.errors?.['required']">
          Vui lòng chọn trạng thái
        </mat-error>
      </mat-form-field>

    </div>
  </div>

  <!-- ACTION -->
  <div class="flex justify-end gap-4 mt-8">

    <button matButton="filled"
            type="button"
            (click)="capNhat()"
            [disabled]="editBanForm.invalid || isLoading">

      <mat-icon *ngIf="isLoading" class="animate-spin">refresh</mat-icon>
      <mat-icon *ngIf="!isLoading">check</mat-icon>

      {{ isLoading ? 'Đang cập nhật...' : 'Cập nhật' }}

    </button>

    <button mat-raised-button type="button" (click)="close()">
      <mat-icon>close</mat-icon>
      Hủy
    </button>

  </div>

</form>
