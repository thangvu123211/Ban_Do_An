<div class="p-6 rounded-2xl shadow-xl bg-white">

  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold">Sửa mã giảm giá</h2>
    <button mat-icon-button (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    <!-- Code -->
    <mat-form-field appearance="outline">
      <mat-label>Mã giảm giá</mat-label>
      <input matInput [(ngModel)]="giamGia.code">
    </mat-form-field>

    <!-- Tên -->
    <mat-form-field appearance="outline">
      <mat-label>Tên chương trình</mat-label>
      <input matInput [(ngModel)]="giamGia.ten_chuong_trinh">
    </mat-form-field>

    <!-- Loại -->
    <div class="grid grid-cols-2 gap-3 col-span-full">
      <mat-form-field appearance="outline">
        <mat-label>Loại giảm giá</mat-label>
        <mat-select [(ngModel)]="giamGia.loai_giam_gia" (selectionChange)="onLoaiGiamGiaChange()">
          <mat-option value="percent">Phần trăm (%)</mat-option>
          <mat-option value="fixed">Tiền mặt (đ)</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Giá trị giảm -->
      <mat-form-field appearance="outline">
        <mat-label>Giá trị giảm</mat-label>
        <input matInput [value]="giaTriGiamDisplay" (input)="onGiaTriGiamInput($event.target.value)"
          placeholder="VD: 10% hoặc 50.000đ">
      </mat-form-field>
    </div>


    <!-- Đơn tối thiểu -->
    <mat-form-field appearance="outline">
      <mat-label>Đơn tối thiểu</mat-label>
      <input matInput [value]="donToiThieuDisplay" (input)="onDonToiThieuInput($event.target.value)"
        placeholder="VD: 100.000đ">
    </mat-form-field>

    <!-- Ngày bắt đầu -->
    <div class="grid grid-cols-2 gap-3 col-span-full">
      <mat-form-field appearance="outline">
        <mat-label>Ngày bắt đầu</mat-label>
        <input matInput [matDatepicker]="startPicker" [(ngModel)]="giamGia.ngay_bat_dau">
        <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
        <mat-datepicker #startPicker></mat-datepicker>
      </mat-form-field>

      <!-- Ngày kết thúc -->
      <mat-form-field appearance="outline">
        <mat-label>Ngày kết thúc</mat-label>
        <input matInput [matDatepicker]="endPicker" [(ngModel)]="giamGia.ngay_ket_thuc">
        <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
        <mat-datepicker #endPicker></mat-datepicker>
      </mat-form-field>
    </div>


    <!-- Trạng thái -->
    <mat-form-field appearance="outline">
      <mat-label>Trạng thái</mat-label>
      <mat-select [(ngModel)]="giamGia.is_active">
        <mat-option [value]="true">Hoạt động</mat-option>
        <mat-option [value]="false">Tắt</mat-option>
      </mat-select>
    </mat-form-field>

  </div>

  <div class="flex justify-end gap-4 mt-6">
    <button mat-raised-button color="primary" (click)="capNhat()" [disabled]="isLoading" class="btn-loading">
      <mat-icon *ngIf="!isLoading">save</mat-icon>

      <mat-icon *ngIf="isLoading" class="spin">autorenew</mat-icon>

      {{ isLoading ? 'Đang lưu...' : 'Lưu' }}
    </button>
    <button mat-button (click)="close()">Hủy</button>
  </div>

</div>
