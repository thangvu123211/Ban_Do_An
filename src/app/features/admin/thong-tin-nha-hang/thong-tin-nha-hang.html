

<div class="relative h-80 flex items-center px-10 bg-white">
  <div>
    <h1 class="text-4xl font-bold mb-3 text-gray-800">
     TRANG QUẢN LÝ NHÀ HÀNG
    </h1>
    <p class="text-gray-600 max-w-xl">
        Đây là trang quản lý cấu hình. Bạn có thể cập nhật thông tin chi tiết, trạng thái và địa chỉ vị trí của nhà
            hàng tại đây.
    </p>
  </div>
</div>

<div *ngIf="hasNhaHang === false && !showCreateForm"
    class="h-96 flex flex-col items-center justify-center text-center space-y-4">

    <h2 class="text-2xl font-bold">Chưa có nhà hàng</h2>
    <p class="text-gray-500 text-sm">Bạn cần tạo nhà hàng để bắt đầu</p>

    <button class="px-6 py-2 bg-gray-900 text-white rounded-lg" (click)="showCreateForm = true">
        ➕ Thêm nhà hàng
    </button>
</div>

<div class="container mx-auto px-6 mt-10 pb-12" *ngIf="showCreateForm || hasNhaHang === true">

    <mat-card class="w-full shadow-xl rounded-2xl p-6 bg-white border border-gray-100">

        <div class="flex justify-between items-center mb-8 border-b pb-4">
            <h3 class="text-2xl font-semibold text-gray-900">
                Cấu Hình Thông Tin Nhà Hàng
            </h3>

        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">

            <div
                class="lg:col-span-1 flex flex-col items-center justify-start border-b lg:border-b-0 lg:border-r border-gray-200 pb-6 lg:pb-0 lg:pr-8">
                <h4 class="text-sm font-semibold text-gray-700 mb-4 self-start">Ảnh đại diện nhà hàng</h4>

                <div
                    class="relative group w-40 h-40 rounded-xl bg-gray-50 border-2 border-dashed border-gray-300 flex items-center justify-center overflow-hidden">

                    <img *ngIf="previewImage" [src]="previewImage" class="w-full h-full object-cover rounded-xl" />

                    <div *ngIf="!previewImage" class="text-center text-gray-400">
                        <span class="text-3xl">🖼️</span>
                        <p class="text-xs">Chưa có ảnh</p>
                    </div>

                </div>

                <input id="file-upload" type="file" class="hidden" accept="image/*" (change)="onFileChange($event)">

                <div class="text-center mt-4 w-full">
                    <label for="file-upload"
                        class="cursor-pointer inline-flex items-center justify-center w-full px-4 py-2 bg-white border border-gray-300 rounded-lg font-medium text-xs text-gray-700 hover:bg-gray-50 transition shadow-sm">
                        📤 Tải ảnh mới
                    </label>
                    <input id="file-upload" type="file" class="hidden" accept="image/*">
                    <p class="text-[11px] text-gray-400 mt-2 leading-relaxed">Hỗ trợ file JPG, PNG dưới 5MB.</p>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Tên nhà hàng <span
                                class="text-red-500">*</span></label>
                        <input type="text" [(ngModel)]="nhaHang.ten_nha_hang" placeholder="Ví dụ: Nhà Hàng Trạng Nguyên"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Địa chỉ nhà hàng <span
                                class="text-red-500">*</span></label>
                        <input type="text" [(ngModel)]="nhaHang.dia_chi" placeholder="Địa chỉ nhà hàng"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Ngân hàng <span
                                class="text-red-500">*</span></label>
                        <input type="text" [(ngModel)]="nhaHang.ngan_hang" placeholder="Ngân hàng"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Số tài khoản <span
                                class="text-red-500">*</span></label>
                        <input type="text" [(ngModel)]="nhaHang.so_tai_khoan" placeholder="Số tài khoản"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Tên người nhận <span
                                class="text-red-500">*</span></label>
                        <input type="text" [(ngModel)]="nhaHang.ten_nguoi_nhan" placeholder="Địa chỉ nhà hàng"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    </div>

                    <div class="space-y-2 md:col-span-2">
                        <label class="block text-sm font-semibold text-gray-700">
                            Mô tả nhà hàng
                        </label>

                        <textarea [(ngModel)]="nhaHang.mo_ta" rows="4" placeholder="Mô tả về nhà hàng..."
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                        </textarea>
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">
                            Giờ mở cửa
                        </label>

                        <input type="time" [(ngModel)]="nhaHang.gio_mo_cua"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">
                            Giờ đóng cửa
                        </label>

                        <input type="time" [(ngModel)]="nhaHang.gio_dong_cua"
                            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">
                    </div>

                    <div class="space-y-2">
                        <label class="block text-sm font-semibold text-gray-700">Trạng thái hoạt động</label>
                        <div class="relative">
                            <select [(ngModel)]="nhaHang.trang_thai"
                                class="w-full px-4 py-2.5 border border-gray-300 rounded-lg">

                                <option [value]="1">🟢 Đang hoạt động</option>
                                <option [value]="0">🔴 Tạm đóng cửa</option>

                            </select>
                        </div>
                    </div>
                </div>



                <div class="flex items-center justify-end space-x-3 pt-6 border-t border-gray-100">
                    <button type="button"
                        class="px-5 py-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium rounded-lg text-sm transition shadow-sm">
                        Hủy bỏ
                    </button>
                    <button type="button" (click)="submit()" [disabled]="loading" class="px-6 py-2 bg-gray-900 text-white rounded-lg
               flex items-center justify-center space-x-2
               disabled:opacity-60 disabled:cursor-not-allowed">

                        <svg *ngIf="loading" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                            </circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                        </svg>

                        <span>
                            {{ loading ? 'Đang xử lý...' : (currentNhaHangId ? 'Cập nhật' : 'Tạo nhà hàng') }}
                        </span>
                    </button>
                </div>
            </div>
        </div>

    </mat-card>

</div>

<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>
