<div class="rounded-2xl shadow-xl w-full h-full
            p-8 flex flex-col
            bg-white text-gray-800">

  <!-- HEADER -->
  <div class="flex justify-between items-start mb-6">

  <!-- LEFT -->
  <div class="flex flex-col">

    <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">
      <mat-icon class="text-xl text-green-500">shopping_cart</mat-icon>
      Giỏ hàng
    </h2>

    <!-- 👇 nằm dưới tiêu đề -->
    <div class="mt-1 inline-flex items-center gap-2 text-sm mt-2">

      <span class="px-3 py-1 rounded-full bg-green-100 text-green-700 font-medium flex items-center gap-1">
        Tổng số món: {{ tongSoMon }}
      </span>

    </div>

  </div>

  <!-- RIGHT -->
  <button mat-icon-button (click)="close()">
    <mat-icon class="text-gray-500 hover:text-gray-800">close</mat-icon>
  </button>

</div>




  <!-- DANH SÁCH MÓN -->
  <div class="flex-1 overflow-y-auto space-y-4 pr-2">

    <div *ngFor="let item of gioHang" class="flex items-center gap-4 rounded-xl p-4
             bg-gray-50 border border-gray-200">

      <!-- Ảnh -->
      <img [src]="item.anh_mon_an?.length ? item.anh_mon_an[0].url : 'assets/no-image.png'"
        class="w-20 h-20 rounded-xl object-cover border border-gray-200" />

      <!-- Thông tin -->
      <div class="flex-1">
        <p class="text-base font-semibold text-gray-900 truncate">
          {{ item.ten_mon_an }}
        </p>

        <span class="text-green-600 text-base font-medium">
          {{ item.gia_tien | number }} đ
        </span>
      </div>

      <!-- Số lượng -->
      <div class="flex items-center gap-2">
        <button (click)="giamSoLuong(item)">
          <mat-icon class="text-gray-500 hover:text-gray-900">remove</mat-icon>
        </button>

        <span class="w-6 text-center font-semibold text-gray-900 mb-2">
          {{ item.soLuong }}
        </span>

        <button (click)="tangSoLuong(item)">
          <mat-icon class="text-gray-500 hover:text-gray-900">add</mat-icon>
        </button>

        <button (click)="removeFromGioHang(item)">
          <mat-icon class="text-red-500 hover:text-red-600">delete</mat-icon>
        </button>
      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="border-t border-gray-200 mt-6 pt-6">

    <!-- Tổng tiền -->
    <div class="flex justify-between items-center font-bold text-lg mb-4">
      <span class="text-gray-900">Tổng tiền</span>
      <span class="text-green-600">
        {{ tongTien | number }} đ
      </span>
    </div>

    <!-- Ghi chú -->
    <div class="mb-4">
      <label class="block text-sm text-gray-600 mb-2">
        Ghi chú cho nhà hàng
      </label>

      <textarea rows="3" placeholder="Ví dụ: ít cay, không hành..." class="w-full text-sm rounded-xl
               border border-gray-300
               bg-white
               p-3
               leading-5
               align-top
               outline-none
               resize-none
               placeholder-gray-400
               focus:border-green-500
               focus:ring-2
               focus:ring-green-500">
      </textarea>
    </div>

    <!-- Nút -->
    <div class="flex gap-4 justify-end">
      <!-- Nút chính -->
      <button matButton="filled" class="px-6 bg-green-500 text-white hover:bg-green-600">
        Thanh Toán
      </button>

      <!-- Nút phụ -->
      <button mat-raised-button class="px-6 bg-white text-gray-700 border border-gray-300 hover:bg-gray-100"
        (click)="close()">
        Đóng
      </button>
    </div>
  </div>

</div>

<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type">
</app-toast-message>
