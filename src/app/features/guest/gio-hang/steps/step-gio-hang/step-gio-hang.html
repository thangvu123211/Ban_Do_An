<div class="h-full flex flex-col">

  <!-- ================== GIỎ HÀNG (CUỘN) ================== -->
  <div class="flex-1 overflow-y-auto space-y-4 pr-2">

    <div *ngFor="let item of gioHang"
         class="flex items-center gap-4 rounded-xl p-4 bg-gray-50 border border-gray-200">

      <img [src]="getImage(item)"
     class="w-20 h-20 rounded-xl object-cover border" />

      <div class="flex-1">
        <p class="font-semibold text-gray-900 truncate">
          {{ item.ten_mon_an }}
        </p>
        <span class="text-green-600 font-medium">
          {{ item.gia_tien | number }} đ
        </span>
      </div>

      <div class="flex items-center gap-2">

        <button (click)="giam.emit(item)">
          <mat-icon>remove</mat-icon>
        </button>

        <span class="w-6 text-center font-semibold">
          {{ item.soLuong }}
        </span>

        <button (click)="tang.emit(item)">
          <mat-icon>add</mat-icon>
        </button>

        <button (click)="xoa.emit(item)">
          <mat-icon class="text-red-500">delete</mat-icon>
        </button>

      </div>
    </div>

  </div>

  <!-- ================== TỔNG TIỀN ================== -->
  <div class="flex justify-between font-bold mt-4">
    <span>Tổng tiền</span>
    <span class="text-green-600">
      {{ tongTien | number }} đ
    </span>
  </div>

  <!-- ================== GHI CHÚ ================== -->
  <div class="border-t pt-4 mt-4 bg-white">

    <label class="block text-sm text-gray-600 mb-2">
      Ghi chú cho nhà hàng
    </label>

    <textarea
      rows="3"
      placeholder="Ví dụ: ít cay, không hành..."
      [(ngModel)]="ghiChu" (ngModelChange)="ghiChuChange.emit($event)"
      class="w-full text-sm rounded-xl border border-gray-300
             bg-white p-3 resize-none
             focus:border-green-500 focus:ring-2 focus:ring-green-500">
    </textarea>

  </div>

</div>
