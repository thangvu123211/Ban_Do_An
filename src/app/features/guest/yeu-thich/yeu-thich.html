<div class="rounded-2xl shadow-xl w-full h-full p-8 flex flex-col bg-white text-gray-800">

  <!-- ===== HEADER ===== -->
  <div class="flex items-center mb-6 gap-4 shrink-0">

    <div class="flex flex-col">
      <h2 class="text-xl font-bold flex items-center gap-2">
        <mat-icon class="text-red-500">favorite</mat-icon>
        Món yêu thích
      </h2>

      <span class="mt-1 px-3 py-1 rounded-full bg-red-100 text-red-700 text-sm w-fit">
        Tổng số món: {{ tongSoYeuThich  }}
      </span>
    </div>

    <span class="flex-1"></span>

    <button mat-icon-button (click)="close()">
      <mat-icon class="text-gray-500 hover:text-gray-800">close</mat-icon>
    </button>
  </div>

  <!-- ===== BODY ===== -->
  <div class="flex-1 overflow-y-auto space-y-4 pr-2">

    <div *ngIf="danhSach.length === 0"
         class="text-gray-400 text-center py-16 text-lg">
      Chưa có món yêu thích
    </div>

    <div *ngFor="let item of danhSach"
         class="flex items-center gap-6 p-4 rounded-2xl bg-gray-50 border hover:shadow-md transition">

      <img
        [src]="item.anh_mon_an?.[0]?.url || 'assets/no-image.png'"
        class="w-24 h-24 rounded-xl object-cover">

      <div class="flex-1">
        <p class="font-semibold text-lg">
          {{ item.ten_mon_an }}
        </p>

        <p class="text-green-600 font-medium mt-1">
          {{ item.gia_tien | number }} đ
        </p>
      </div>

    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="border-t pt-4 mt-4 flex justify-end gap-3">
    <button mat-raised-button color="primary" (click)="close()">
      Đóng
    </button>
  </div>

</div>
