<div class="rounded-3xl shadow-2xl w-full h-full bg-white flex flex-col overflow-hidden">

    <!-- ================= HEADER ================= -->
    <div class="flex justify-between items-center px-6 py-4 border-b">

        <h2 class="text-xl font-bold flex items-center gap-2 text-gray-800">
            <mat-icon class="text-green-500">restaurant</mat-icon>
            {{ data.ten_mon_an }}
        </h2>

        <button mat-icon-button (click)="dialogRef.close()">
            <mat-icon>close</mat-icon>
        </button>

    </div>

    <!-- ================= TAB ================= -->
    <div class="flex gap-2 px-6 py-3 border-b bg-gray-50">

        <button mat-flat-button (click)="setTab('info')" [class.bg-green-500]="activeTab === 'info'"
            [class.text-white]="activeTab === 'info'">

            Món ăn
        </button>

        <button mat-flat-button (click)="setTab('comment')" [class.bg-green-500]="activeTab === 'comment'"
            [class.text-white]="activeTab === 'comment'">

            Bình luận
        </button>

        <button mat-flat-button (click)="setTab('rating')" [class.bg-green-500]="activeTab === 'rating'"
            [class.text-white]="activeTab === 'rating'">

            Đánh giá
        </button>

    </div>

    <!-- ================= BODY ================= -->
    <div class="flex-1 overflow-y-auto p-6">

        <!-- ===== INFO ===== -->
        <div *ngIf="activeTab === 'info'" class="space-y-4">

            <div class="rounded-2xl overflow-hidden shadow-md">
                <img class="w-full h-64 object-cover"
                    [src]="data.anh_mon_an?.length ? data.anh_mon_an[0].url : 'assets/no-image.png'" />
            </div>

            <div class="text-gray-700 leading-7">
                {{ data.mo_ta }}
            </div>

            <div class="flex justify-between items-center bg-green-50 p-4 rounded-2xl border">

                <span class="text-gray-600">Giá món</span>

                <span class="text-2xl font-bold text-green-600">
                    {{ data.gia_tien | number }} đ
                </span>

            </div>

        </div>

        <!-- ===== COMMENT ===== -->
        <div *ngIf="activeTab === 'comment'" class="flex flex-col h-full">

            <!-- LIST (scroll) -->
            <div class="flex-1 overflow-y-auto space-y-3 pr-2">

                <div *ngFor="let c of binhLuans" class="p-4 rounded-2xl bg-gray-50 border hover:shadow-sm transition">

                    <div class="flex justify-between text-sm text-gray-500 mb-1">
                        <span class="font-medium text-gray-700">
                            {{ c.nguoi_dung?.ho_ten || 'Ẩn danh' }}
                        </span>

                        <span>{{ c.created_at | date:'short' }}</span>
                    </div>

                    <div class="text-gray-800">
                        {{ c.noi_dung }}
                    </div>

                </div>

            </div>

            <!-- INPUT (sticky bottom) -->
            <div class="flex gap-2 p-3 border-t bg-white sticky bottom-0">

                <input [(ngModel)]="noiDungBinhLuan" placeholder="Viết bình luận..." (keyup.enter)="guiBinhLuan()"
                    class="flex-1 border rounded-xl px-4 py-2 focus:ring-2 focus:ring-green-400 outline-none" />

                <button mat-flat-button color="primary" (click)="guiBinhLuan()">
                    Gửi
                </button>

            </div>

        </div>

        <!-- ===== RATING ===== -->
        <div *ngIf="activeTab === 'rating'" class="space-y-4">

            <div class="bg-yellow-50 border rounded-2xl p-5">

                <label class="text-gray-700 font-medium mb-2 block">
                    Chọn số sao
                </label>

                <select [(ngModel)]="diemDanhGia" class="w-full border rounded-xl p-2">

                    <option *ngFor="let i of [1,2,3,4,5]" [value]="i">
                        {{ i }} ⭐
                    </option>

                </select>

            </div>

            <textarea [(ngModel)]="noiDungDanhGia" placeholder="Nhận xét của bạn..."
                class="w-full border rounded-xl p-3 focus:ring-2 focus:ring-yellow-400 outline-none" rows="4">
      </textarea>

            <button mat-flat-button color="primary" class="w-full" (click)="guiDanhGia()">
                Gửi đánh giá
            </button>

        </div>

    </div>

    <!-- ================= FOOTER ================= -->
    <div class="border-t px-6 py-4 flex justify-end gap-2 bg-white">

        <button mat-flat-button class="bg-green-500 text-white" (click)="addToGioHang(data)">
            Thêm giỏ hàng
        </button>

        <button mat-button (click)="close()">
            Đóng
        </button>

    </div>

</div>
<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"> </app-toast-message>
