<div class="relative flex flex-col max-h-[90vh] bg-white">

    <!-- ================= HEADER ================= -->
    <div class="flex justify-end p-2 border-b bg-white sticky top-0 z-10">
        <button mat-icon-button (click)="close()" class="hover:bg-yellow-900">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- ================= CONTENT (SCROLL) ================= -->
    <div class="flex-1 overflow-y-auto p-4 md:p-6">

        <div class="flex flex-col md:flex-row gap-4 md:gap-6">

            <!-- Ảnh bàn -->
            <div>
                <img *ngIf="data.table?.anh_ban?.length" [src]="data.table.anh_ban[0].url" class="
            w-full max-w-[240px]
            h-48 sm:h-56
            md:w-72 md:h-72
            object-cover rounded-xl shadow-lg mx-auto
          " />

                <div class="flex justify-center pt-3 tooltipne">
                    <button mat-icon-button (click)="openImageModal(data.table.anh_ban[0].url)"
                        matTooltip="Phóng to hình ảnh">
                        <mat-icon>zoom_in</mat-icon>
                    </button>
                </div>
            </div>

            <!-- Nội dung -->
            <div class="flex-1 min-w-0">
                <h2 class="text-2xl font-semibold mb-3">
                    Xác nhận đặt bàn
                </h2>

                <p class="mb-2">
                    <strong>Bàn:</strong>
                    {{ data.table?.ten_ban || ('Bàn ' + data.table?.ma_ban) }}
                </p>

                <p class="mb-2">
                    <strong>Ngày:</strong>
                    {{ data.ngay | date:'dd/MM/yyyy' }}
                </p>

                <p class="mb-4">
                    <strong>Giờ:</strong>
                    {{ data.gio }}:00
                </p>

                <!-- Form -->
                <mat-form-field appearance="outline" class="w-full mb-3">
                    <mat-label>Tên khách hàng</mat-label>
                    <input matInput [(ngModel)]="TENKHACHHANG">
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full mb-3">
                    <mat-label>Số điện thoại</mat-label>
                    <input matInput type="tel" [(ngModel)]="SDT">
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full mb-3">
                    <mat-label>Email</mat-label>
                    <input matInput type="email" [(ngModel)]="EMAIL">
                </mat-form-field>

                <mat-form-field appearance="outline" class="w-full mb-3">
                    <mat-label>Ghi chú</mat-label>
                    <textarea matInput rows="3" placeholder="Ví dụ: Ngồi gần cửa sổ, bàn riêng tư..."
                        [(ngModel)]="GHICHU"></textarea>
                </mat-form-field>

                <div class="text-sm text-gray-600 mt-2">
                    <strong>Lưu ý:</strong>
                    Nếu khách hàng trễ từ 15–30 phút, bàn sẽ tự động hủy.
                </div>
            </div>
        </div>
    </div>

    <!-- ================= FOOTER ================= -->
    <div class="border-t bg-white p-3 flex gap-2 justify-end sticky bottom-0">
        <button matButton="filled" class="w-full md:w-auto" (click)="confirm()">
            <mat-icon>check</mat-icon>
            Xác nhận
        </button>

        <button mat-raised-button class="w-full md:w-auto" (click)="close()">
            <mat-icon>close</mat-icon>
            Hủy
        </button>
    </div>
</div>

<!-- TOAST -->
<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type">
</app-toast-message>
