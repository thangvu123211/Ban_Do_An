<div class="p-6 sm:p-8 bg-white rounded-2xl max-w-full font-sans text-slate-800 tracking-normal selection:bg-indigo-100">
  
  <div class="flex items-center gap-3.5 border-b border-slate-100 pb-4 mb-5">
    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-amber-50 text-amber-500 shrink-0">
      <mat-icon class="!w-6 !h-6 !text-[24px]">warning</mat-icon>
    </div>
    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 m-0">Xác nhận thanh toán</h2>
  </div>

  <p class="text-[15px] text-slate-500 leading-relaxed mb-5">
    Vui lòng kiểm tra lại đầy đủ thông tin trước khi thanh toán.
  </p>

  <div class="bg-slate-50 border border-slate-100 rounded-xl p-5 mb-5 space-y-3.5">
    <div class="flex justify-between items-start gap-4 text-[15px]">
      <span class="text-slate-400 font-medium whitespace-nowrap">Người nhận:</span>
      <span class="font-semibold text-slate-800 text-right">{{ data.tenNguoiNhan }}</span>
    </div>
    
    <div class="flex justify-between items-center gap-4 text-[15px]">
      <span class="text-slate-400 font-medium whitespace-nowrap">SĐT:</span>
      <span class="font-semibold text-slate-800 text-right">{{ data.sdt }}</span>
    </div>
    
    <div class="flex justify-between items-start gap-4 text-[15px]">
      <span class="text-slate-400 font-medium whitespace-nowrap">Địa chỉ:</span>
      <span class="font-semibold text-slate-800 text-right leading-snug">{{ data.diaChi }}</span>
    </div>
    
    <div class="border-t border-dashed border-slate-200 pt-4 mt-2 flex justify-between items-center gap-4">
      <span class="text-base font-bold text-slate-900">Tổng tiền:</span>
      <span class="text-2xl font-black text-rose-600 tracking-tight">
        {{ data.tongTien | number }}<span class="text-lg font-bold ml-0.5">đ</span>
      </span>
    </div>
  </div>

  <div class="flex gap-3 bg-blue-50/60 border border-blue-100/80 rounded-xl p-4 mb-6">
    <svg class="w-5 h-5 text-blue-500 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <p class="text-sm text-blue-700 font-medium leading-relaxed m-0">
      Sau khi xác nhận, hệ thống sẽ tạo hóa đơn và mã QR thanh toán.
    </p>
  </div>

  <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-2">
    <button 
      mat-stroked-button 
      color="basic" 
      (click)="huy()"
      class="!h-12 !px-6 !rounded-xl !font-semibold !text-slate-600 !border-slate-200 hover:!bg-slate-50 !transition-all !text-[15px]">
      Hủy
    </button>

    <button 
      mat-flat-button 
      color="primary" 
      (click)="xacNhan()"
      class="!h-12 !px-6 !rounded-xl !font-semibold !bg-indigo-600 hover:!bg-indigo-700 !text-white !shadow-sm hover:!shadow-md !transition-all !text-[15px]">
      Xác nhận thanh toán
    </button>
  </div>
</div>
