<!-- CHỐNG CRASH -->
<div *ngIf="mon; else noData" class="h-full flex flex-col bg-white">

  <!-- ===== HEADER ===== -->
  <div class="flex items-center justify-between px-6 py-4 border-b">
    <h2 class="text-gray-800 font-semibold">
      Cập nhật món ăn trong nhà hàng
    </h2>

    <button mat-icon-button (click)="huy()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- ===== BODY (NGANG STRONGER) ===== -->
  <div class="flex flex-col md:flex-row flex-1 overflow-hidden">

    <!-- ================= LEFT (NHỎ LẠI) ================= -->
    <div class="w-full md:w-4/12 bg-gray-50 flex flex-col items-center justify-start 
            p-3 md:p-4 gap-3 md:gap-4">

      <!-- IMAGE -->
      <img [src]="mon.anh || 'assets/no-image.png'"
        class="w-full h-40 md:h-64 object-cover rounded-lg md:rounded-xl shadow" />

      <!-- INFO -->
      <div class="text-center">
        <p class="text-base md:text-lg font-semibold text-gray-900">
          {{ mon.ten_mon_an }}
        </p>

        <p class="text-green-600 text-lg md:text-xl font-bold mt-1">
          {{ mon.gia_goc | number }} đ
        </p>
      </div>

      <!-- QUANTITY -->
      <div class="flex items-center gap-2 bg-white border rounded-full 
              px-2 md:px-3 py-1 shadow-sm">

        <button mat-icon-button (click)="giamSoLuong()" [disabled]="soLuong === 1">
          <mat-icon class="text-sm md:text-base">remove</mat-icon>
        </button>

        <span class="w-6 text-center font-semibold text-sm md:text-base">
          {{ soLuong }}
        </span>

        <button mat-icon-button (click)="tangSoLuong()">
          <mat-icon class="text-sm md:text-base">add</mat-icon>
        </button>

      </div>

    </div>

    <!-- ================= RIGHT (RỘNG HƠN) ================= -->
    <div class="w-full md:w-8/12 px-4 md:px-6 py-4 md:py-6 overflow-y-auto space-y-6">

      <!-- OPTIONS -->
      <div class="space-y-5">

        <div *ngFor="let nhom of optionsData" class="border rounded-xl p-4 bg-gray-50">

          <!-- HEADER NHÓM -->
          <div class="flex justify-between items-center mb-3">
            <p class="font-bold text-gray-800">
              {{ nhom.ten_nhom }}
            </p>

            <span class="text-xs px-2 py-1 rounded-full bg-gray-200 text-gray-600">
              {{ nhom.chon_nhieu ? 'Chọn nhiều' : 'Chọn 1' }}
            </span>
          </div>

          <!-- OPTIONS -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">

            <label *ngFor="let opt of nhom.option_items" class="flex items-center justify-between
                          px-3 py-2 rounded-lg border bg-white
                          hover:border-green-400 cursor-pointer">

              <div class="flex items-center gap-2">
                <input [type]="nhom.chon_nhieu ? 'checkbox' : 'radio'" [name]="'nhom_' + nhom.ma_nhom_option"
                  [checked]="isChecked(opt)" (change)="toggleOption(nhom, opt)" class="accent-green-500 w-4 h-4" />

                <span class="text-sm text-gray-800">
                  {{ opt.ten_option }}
                </span>
              </div>

              <span class="text-green-600 text-xs font-semibold">
                +{{ opt.gia_them | number }}đ
              </span>

            </label>

          </div>

        </div>
      </div>



      <!-- TỔNG TIỀN -->
      <div class="flex justify-between items-center pt-4 border-t">
        <span class="text-lg font-semibold">Tổng tiền</span>
        <span class="text-2xl font-bold text-green-600">
          {{ tongTien | number }} đ
        </span>
      </div>

    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div
    class="flex flex-col sm:flex-row gap-3 sm:gap-0 justify-between items-stretch sm:items-center px-4 md:px-6 py-4 border-t bg-white">

    <span class="text-gray-600 text-sm">
      Giá đã bao gồm topping
    </span>

    <div class="flex flex-col sm:flex-row gap-2 sm:gap-3 w-full sm:w-auto">
      <button mat-stroked-button class="w-full sm:w-auto" (click)="huy()">Hủy</button>
      <button mat-flat-button class="w-full sm:w-auto" (click)="xacNhan()">
        Cập nhật giỏ hàng
      </button>
    </div>

  </div>

</div>

<!-- FALLBACK -->
<ng-template #noData>
  <div class="flex items-center justify-center h-full text-gray-400">
    Không có dữ liệu món ăn
  </div>
</ng-template>
