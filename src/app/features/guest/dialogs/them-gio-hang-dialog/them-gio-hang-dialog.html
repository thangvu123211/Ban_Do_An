<!-- CHỐNG CRASH -->
<div *ngIf="mon; else noData" class="h-full flex flex-col bg-white">

  <!-- ===== HEADER ===== -->
  <div class="flex items-center justify-between px-6 py-4 border-b">
    <h2 class="text-gray-800">
      Thêm vào giỏ hàng
    </h2>

    <button mat-icon-button (click)="huy()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- ===== BODY ===== -->
  <div class="flex flex-1 overflow-hidden">

    <!-- LEFT: IMAGE -->
    <div class="w-5/12 bg-gray-50 flex items-center justify-center p-6">
      <img
        [src]="mon.anh_mon_an?.length ? mon.anh_mon_an[0].url : 'assets/no-image.png'"
        class="max-w-full max-h-full object-contain rounded-xl shadow-sm"
      />
    </div>

    <!-- RIGHT: CONTENT -->
    <div class="w-7/12 px-8 py-6 overflow-y-auto pb-32 space-y-6">

      <!-- INFO -->
      <div>
        <p class="text-xl font-semibold text-gray-900">
          {{ mon.ten_mon_an }}
        </p>

        <p class="text-green-600 text-2xl font-bold mt-1">
          {{ mon.gia_tien | number }} đ
        </p>
      </div>

      <!-- ===== SỐ LƯỢNG ===== -->
      <div class="flex items-center justify-between">
        <span class="font-medium text-gray-700">Số lượng</span>

        <div class="flex items-center gap-2 bg-gray-100 rounded-full px-2 py-1">
          <button mat-icon-button (click)="giamSoLuong()" [disabled]="soLuong === 1"
            class="w-7 h-7 rounded-full bg-white shadow flex items-center justify-center">
            <mat-icon class="text-base">remove</mat-icon>
          </button>

          <span class="w-6 text-center font-semibold text-sm">
            {{ soLuong }}
          </span>

          <button mat-icon-button (click)="tangSoLuong()"
            class="w-7 h-7 rounded-full bg-green-500 text-white shadow flex items-center justify-center">
            <mat-icon class="text-base">add</mat-icon>
          </button>
        </div>
      </div>

      <!-- ===== TOPPING ===== -->
      <div>
        <p class="font-semibold text-gray-800 mb-2">Topping</p>

        <div class="flex flex-wrap gap-2">
          <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50">
            <input type="checkbox" /> Trứng (+10.000đ)
          </label>
          <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50">
            <input type="checkbox" /> Phô mai (+15.000đ)
          </label>
          <label class="flex items-center gap-2 px-3 py-2 border rounded-lg cursor-pointer hover:bg-gray-50">
            <input type="checkbox" /> Xúc xích (+12.000đ)
          </label>
        </div>
      </div>

      <!-- ===== CẤP ĐỘ CAY ===== -->
      <div>
        <p class="font-semibold text-gray-800 mb-2">Cấp độ cay</p>
        <div class="flex gap-4 text-gray-700">
          <label><input type="radio" name="cay" checked /> Không cay</label>
          <label><input type="radio" name="cay" /> Cay vừa 🌶️</label>
          <label><input type="radio" name="cay" /> Cay nhiều 🌶️🌶️</label>
        </div>
      </div>

      <!-- ===== CHẾ BIẾN ===== -->
      <div>
        <p class="font-semibold text-gray-800 mb-2">Chế biến</p>
        <div class="flex gap-4 text-gray-700">
          <label><input type="radio" name="nau" checked /> Nấu bình thường</label>
          <label><input type="radio" name="nau" /> Không nấu</label>
        </div>
      </div>

      <!-- ===== GHI CHÚ ===== -->
      <div>
        <p class="font-semibold text-gray-800 mb-2">Ghi chú</p>
        <textarea
          rows="3"
          placeholder="Ví dụ: ít hành, không tiêu..."
          class="w-full border rounded-lg p-3 focus:outline-none focus:ring focus:ring-green-200">
        </textarea>
      </div>

      <!-- ===== TỔNG TIỀN ===== -->
      <div class="flex justify-between items-center pt-4 border-t">
        <span class="text-lg font-semibold">Tổng tiền</span>
        <span class="text-2xl font-bold text-green-600">
          {{ tongTien | number }} đ
        </span>
      </div>

    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <div class="flex justify-between items-center px-6 py-4 border-t bg-white">
    <span class="text-gray-600 text-sm">
      Giá đã bao gồm topping
    </span>

    <div class="flex gap-3">
      <button mat-stroked-button (click)="huy()">Hủy</button>
      <button mat-flat-button color="primary" (click)="xacNhan()">
        Thêm vào giỏ hàng
      </button>
    </div>
  </div>
</div>

<!-- FALLBACK -->
<ng-template #noData>
  <div class="flex items-center justify-center h-full text-gray-400">
    Không có dữ liệu món ăn
  </div>
</ng-template>
