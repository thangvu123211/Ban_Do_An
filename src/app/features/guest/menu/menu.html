<div class="flex overflow-hidden flex-col min-h-screen pt-20 mt-16 ">
  <section class=" text-center">
    <div class="mx-auto px-2 md:px-6">

      <div class="flex justify-between items-center mb-6 pr-4">
        <h2 class="text-2xl font-bold text-yellow-600 pr-6">Danh mục món ăn</h2>
      </div>

      <!-- HÀNG NGANG -->
      <div class="flex items-center gap-4">

        <!-- NÚT TRÁI -->
        <button mat-icon-button (click)="scrollLeft()" class="bg-gray-800 text-amber-400
               hover:bg-amber-400 hover:text-black
               rounded-full shrink-0 z-10">
          <mat-icon>chevron_left</mat-icon>
        </button>

        <!-- KHUNG CHẶN TRÀN (QUAN TRỌNG NHẤT) -->
        <div class="flex-1 overflow-hidden">

          <!-- DIV SCROLL -->
          <div #scrollContainer class="flex gap-8 overflow-x-auto scroll-smooth scrollbar-hide">

            <div *ngFor="let loai of loaimonan" class="flex-shrink-0 w-32 cursor-pointer"
              (click)="getMonAnTheoLoai(loai.ma_loai_mon_an)">

              <div class="w-32 h-32 mx-auto rounded-full overflow-hidden border-4"
                [class.border-amber-400]="selectedLoai === loai.ma_loai_mon_an"
                [class.border-gray-600]="selectedLoai !== loai.ma_loai_mon_an">

                <img [src]="loai.anh_loai_mon_an" class="w-full h-full object-cover" />
              </div>

              <p class="mt-3 text-center font-medium" [class.text-amber-400]="selectedLoai === loai.ma_loai_mon_an"
                [class.text-black]="selectedLoai !== loai.ma_loai_mon_an">

                {{ loai.ten_loai_mon_an }}

              </p>
            </div>

          </div>
        </div>

        <!-- NÚT PHẢI -->
        <button mat-icon-button (click)="scrollRight()" class="bg-gray-800 text-amber-400
               hover:bg-amber-400 hover:text-black
               rounded-full shrink-0 z-10">
          <mat-icon>chevron_right</mat-icon>
        </button>

      </div>

    </div>
  </section>

  <!-- 🔹 Nội dung chính -->
  <section class="py-16">
    <div class="flex justify-between items-center mb-6 pr-4 ml-7">
      <h2 class="text-2xl font-bold text-yellow-600 pr-6">{{tieuDe}}</h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 px-6">
      <div *ngFor="let mon of MonAn">
        <mat-card
          class="rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition duration-200 flex flex-col">
          <!-- Ảnh -->
          <mat-card-header class="p-0">
            <div class="relative w-full h-48">
              <img [src]="mon.anh_mon_an?.length ? mon.anh_mon_an[0].url : 'assets/no-image.png'"
                class="w-full h-full object-cover" />
            </div>
          </mat-card-header>

          <!-- Nội dung -->
          <mat-card-content class="p-4 flex flex-col flex-grow">
            <div class="mt-4 flex items-center gap-2">
              <h3 class="font-semibold text-lg ">
                {{ mon.ten_mon_an }}
              </h3>

              <button mat-icon-button matTooltip="Thông tin món">
                <mat-icon>info</mat-icon>
              </button>
            </div>
            <p class="text-xs mt-1 line-clamp-2">
              {{ mon.mo_ta || 'Món ăn ngon, chế biến từ nguyên liệu tươi.' }}
            </p>

            <!-- Giá (đẩy sát đáy) -->
            <div class="mt-auto pt-3 flex items-center justify-between">
              <span class="text-amber-400 font-bold text-lg">
                {{ mon.gia_tien | number }} đ
              </span>

              <button mat-icon-button matTooltip="Thêm vào giỏ hàng" (click)="addToGioHang(mon)">
                <mat-icon>shopping_bag_speed</mat-icon>
              </button>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </section>

  <!-- 🧃 Toast -->
  <app-toast-message [message]="toastMessage" [type]="toastType" [show]="showToast"
    class="fixed bottom-5 right-5 z-[9999]"></app-toast-message>
</div>
