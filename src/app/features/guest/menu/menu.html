<div class="flex overflow-hidden flex-col min-h-screen pt-20 mt-16 bg-gray-50">

  <!-- ===== DANH MỤC ===== -->
  <section class="text-center">
    <div class="mx-auto px-2 md:px-6">

      <div class="flex justify-between items-center mb-6 pr-4">
        <h2 class="text-2xl font-bold text-gray-900 pr-6">
          Danh mục món ăn
        </h2>
      </div>

      <div class="flex items-center gap-4">

        <!-- NÚT TRÁI -->
        <button
          mat-icon-button
          (click)="scrollLeft()"
          class="bg-white text-gray-600 border border-gray-300
                 hover:bg-gray-100 hover:text-gray-900
                 rounded-full shrink-0 z-10 shadow">
          <mat-icon>chevron_left</mat-icon>
        </button>

        <!-- KHUNG SCROLL -->
        <div class="flex-1 overflow-hidden">
          <div
            #scrollContainer
            class="flex gap-8 overflow-x-auto scroll-smooth scrollbar-hide py-2">

            <div
              *ngFor="let loai of loaimonan"
              class="flex-shrink-0 w-32 cursor-pointer"
              (click)="getMonAnTheoLoai(loai.ma_loai_mon_an)">

              <div
                class="w-32 h-32 mx-auto rounded-full overflow-hidden border-4 transition"
                [class.border-green-500]="selectedLoai === loai.ma_loai_mon_an"
                [class.border-gray-300]="selectedLoai !== loai.ma_loai_mon_an">

                <img
                  [src]="loai.anh_loai_mon_an"
                  class="w-full h-full object-cover" />
              </div>

              <p
                class="mt-3 text-center font-medium transition"
                [class.text-green-600]="selectedLoai === loai.ma_loai_mon_an"
                [class.text-gray-700]="selectedLoai !== loai.ma_loai_mon_an">

                {{ loai.ten_loai_mon_an }}

              </p>
            </div>

          </div>
        </div>

        <!-- NÚT PHẢI -->
        <button
          mat-icon-button
          (click)="scrollRight()"
          class="bg-white text-gray-600 border border-gray-300
                 hover:bg-gray-100 hover:text-gray-900
                 rounded-full shrink-0 z-10 shadow">
          <mat-icon>chevron_right</mat-icon>
        </button>

      </div>
    </div>
  </section>

  <!-- ===== DANH SÁCH MÓN ===== -->
  <section class="py-16">
    <div class="flex justify-between items-center mb-6 pr-4 ml-7">
      <h2 class="text-2xl font-bold text-gray-900 pr-6">
        {{ tieuDe }}
      </h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 px-6">

      <div *ngFor="let mon of MonAn">
        <mat-card
  class="rounded-xl overflow-hidden bg-white
         border border-gray-200
         shadow hover:shadow-xl transition duration-200
         flex flex-col h-[420px]">

  <!-- Ảnh -->
  <mat-card-header class="p-0">
    <div class="relative w-full h-60 bg-gray-100">
      <img
        [src]="mon.anh_mon_an?.length ? mon.anh_mon_an[0].url : 'assets/no-image.png'"
        class="w-full h-full object-cover" />
    </div>
  </mat-card-header>

  <!-- Nội dung -->
  <mat-card-content class="p-4 flex flex-col flex-grow">

    <div class="mt-2 flex items-center gap-2">
      <h3 class="font-semibold text-lg text-gray-900">
        {{ mon.ten_mon_an }}
      </h3>

      <button mat-icon-button matTooltip="Thông tin món" (click)="moThongTinMon(mon)">
        <mat-icon class="text-gray-500 hover:text-gray-900">
          info
        </mat-icon>
      </button>
    </div>

    <p class="text-xs text-gray-600 mt-1 line-clamp-2">
      {{ mon.mo_ta || 'Món ăn ngon, chế biến từ nguyên liệu tươi.' }}
    </p>

    <!-- Giá + nút -->
    <div class="mt-auto pt-4 flex items-center justify-between">
      <span class="text-green-600 font-bold text-lg">
        {{ mon.gia_tien | number }} đ
      </span>

      <button
        mat-icon-button
        matTooltip="Thêm vào giỏ hàng"
        class="bg-green-500 text-white rounded-full"
        (click)="addToGioHang(mon)">
        <mat-icon>shopping_bag</mat-icon>
      </button>
    </div>

  </mat-card-content>
</mat-card>
      </div>

    </div>
  </section>

  <!-- TOAST -->
  <app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>

</div>
