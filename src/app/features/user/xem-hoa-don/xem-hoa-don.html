<!-- HEADER -->
<div class="relative h-96 flex items-center justify-start px-10">
  <div class="z-10">
    <h1 class="text-5xl font-bold mb-4">Hello Admin</h1>
    <p class="text-lg max-w-lg">
      Đây là trang quản lý bàn ăn. Bạn có thể thêm, sửa hoặc xóa thông tin bàn ăn tại đây.
    </p>

    <button matButton="filled"  class="px-4 py-2">
      Thêm Mới bàn ăn
    </button>
  </div>
</div>

<!-- KHUNG DỮ LIỆU -->
<div class="container mx-auto px-6 mt-10">

  <mat-card class="w-full shadow-xl rounded-2xl p-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-6 border-b pb-4">

      <h3 class="text-2xl font-semibold">
        Danh Sách Bàn Ăn
      </h3>

      <button mat-flat-button >
        Thêm mới
      </button>
    </div>

    <!-- TABLE -->
    <div class="overflow-x-auto">
      <table class="min-w-full border rounded-lg overflow-hidden text-sm">

        <thead class="text-sm">
          <tr>
            <th class="px-4 py-4 text-center border">STT</th>
            <th class="px-4 py-4 text-center border">Ảnh bàn</th>
            <th class="px-4 py-4 text-center border">QR Bàn Ăn</th>
            <th class="px-4 py-4 text-center border">Tên Bàn</th>
            <th class="px-4 py-4 text-center border">Số Chỗ Ngồi</th>
            <th class="px-4 py-4 text-center border">Trạng Thái</th>
            <th class="px-4 py-4 text-center border">Hành động</th>
          </tr>
        </thead>

        

      </table>
    </div>

  </mat-card>

</div>
