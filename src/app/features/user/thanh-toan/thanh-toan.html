<!-- phần giao diện hóa đơn ở trên -->



<main class="flex-1 p-6 overflow-auto bg-gray-800 text-gray-100">

    <div class="overflow-x-auto rounded-lg shadow border border-gray-700">
        <table class="min-w-full divide-y divide-gray-700">
            <thead class="bg-gray-700 text-gray-200">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Mã HĐ</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Bàn</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Ngày lập</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Giờ tạo</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Tổng tiền</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Trạng thái</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider">Hành động</th>
            </thead>

            <tbody class="divide-y divide-gray-700 bg-gray-800">
                <ng-container *ngFor="let hd of HoaDon; let i = index">
                    <tr class="hover:bg-gray-700 transition">
                        <td class="px-6 py-3">{{ hd.MA_HD }}</td>
                        <td class="px-6 py-3">{{ hd.TENBAN }}</td>
                        <td class="px-6 py-3">{{ hd.NGAYLAPHOADON | date: 'dd/MM/yyyy' }}</td>
                        <td class="px-6 py-3">{{ hd.GIOTAOHOADON }}</td>
                        <td class="px-6 py-3 font-semibold text-green-400">{{ hd.TONGTIEN | number }} VND</td>

                        <td class="px-6 py-3">
                            <span *ngIf="hd.TRANGTHAI == 1" class="px-3 py-1 rounded bg-red-600 text-white">Chưa thanh toán 
                            </span>
                        </td>

                        <td class="px-6 py-3">
                            <div class="flex gap-2 items-center">
                                <!-- Nút Xác nhận (chỉ hiện khi TRANGTHAI = 0) -->
                                <button *ngIf="hd.TRANGTHAI == 1"
                                    class="bg-blue-600 hover:bg-white-700 text-white text-sm px-3 py-1 rounded" (click)="openThanhToan(hd)">
                                    Thanh Toán
                                </button>

                                <!-- Nút Hủy (chỉ hiện khi TRANGTHAI = 0) -->

                            </div>
                        </td>

                    </tr>

                    <!-- ========== Chi tiết hóa đơn ========== -->

                </ng-container>
            </tbody>
        </table>
    </div>
</main>
<app-toast-message [message]="toastMessage" [type]="toastType" [show]="showToast">
</app-toast-message>
