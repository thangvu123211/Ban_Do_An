<div class="p-6">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold">{{ mon.ten_mon_an }}</h2>
        <button mat-icon-button (click)="close()">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- TAB -->
    <div class="flex gap-2 mb-4">
        <button mat-flat-button (click)="tab='comment'" [color]="tab==='comment' ? 'primary' : undefined">
            Bình luận
        </button>

        <button mat-flat-button (click)="tab='rating'" [color]="tab==='rating' ? 'primary' : undefined">
            Đánh giá
        </button>
    </div>

    <!-- ================= BÌNH LUẬN ================= -->
    <div *ngIf="tab==='comment'" class="space-y-4 max-h-[60vh] overflow-y-auto">

        <div *ngFor="let c of binhLuans" class="border rounded-xl p-4 bg-gray-50">

            <!-- Header -->
            <div class="flex justify-between items-center">
                <b>{{ c.nguoi_dung?.ho_ten || 'Ẩn danh' }}</b>

                <div class="flex gap-1">
                    <!-- Sửa -->
                    <button mat-icon-button color="primary" (click)="openEditCMT(c)">
                        <mat-icon>edit</mat-icon>
                    </button>

                    <!-- Xóa -->
                    <button mat-icon-button color="warn" (click)="deleteBinhLuan(c.id)">
                        <mat-icon>delete</mat-icon>
                    </button>
                </div>
            </div>

            <!-- Nội dung -->
            <p *ngIf="editId !== c.id" class="mt-2">
                {{ c.noi_dung }}
            </p>

            <!-- Form sửa -->
            <div *ngIf="editId === c.id" class="mt-3 space-y-2">
                <textarea [(ngModel)]="editNoiDung" rows="3"
                    class="w-full border rounded-lg p-2 focus:outline-none focus:ring"></textarea>

                <div class="flex justify-end gap-2">
                    <button mat-stroked-button (click)="cancelEditCMT()">Hủy</button>
                    <button mat-raised-button color="primary" (click)="submitEdit(c.id)">
                        Sửa
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- ================= ĐÁNH GIÁ ================= -->
    <div *ngIf="tab==='rating'" class="space-y-4 max-h-[60vh] overflow-y-auto">

        <div *ngFor="let r of danhGias" class="border rounded-xl p-4 bg-white">

            <div class="flex justify-between items-center">

                <b>{{ r.nguoi_dung?.ho_ten || 'Ẩn danh' }}</b>

                <!-- ⭐ rating -->
                <div class="flex items-center gap-1 text-amber-400">
                    <mat-icon *ngFor="let i of [1,2,3,4,5]">
                        {{ i <= r.so_sao ? 'star' : 'star_border' }} </mat-icon>
                </div>

                <!-- 🔥 TAG TRẠNG THÁI -->
                <span class="px-2 py-1 text-xs rounded-full" [ngClass]="r.trang_thai === 'hien' 
                    ? 'bg-green-100 text-green-600' 
                    : 'bg-red-100 text-red-600'">

                    {{ r.trang_thai === 'hien' ? 'Đang hiển thị' : 'Đã bị ẩn' }}
                </span>

                <!-- 🔘 NÚT -->
                <button mat-icon-button color="warn" *ngIf="r.trang_thai === 'hien'" (click)="AnDanhGia(r.ID)"
                    matTooltip="Ẩn đánh giá">

                    <mat-icon>no_accounts</mat-icon>
                </button>

                <button mat-icon-button color="primary" matTooltip="Sửa đánh giá" (click)="openEdit(r)">

                    <mat-icon>edit</mat-icon>
                </button>

            </div>

            <p class="mt-2 text-gray-600">
                {{ r.noi_dung || 'Không có nội dung' }}
            </p>
        </div>

    </div>

</div>
<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>
