<div class="flex h-screen bg-gray-900 text-gray-100 overflow-hidden flex-col">
    <!-- 🔹 Thanh danh mục món ăn (đặt ở đầu trang) -->
    <div
        class="bg-gray-800 shadow-lg border-b border-gray-700 p-4 flex gap-3 overflow-x-auto whitespace-nowrap justify-start">
        <button (click)="getAllMonAn()" [class.bg-yellow-500]="selectedLoai === null"
            class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-all duration-200 font-semibold">
            <mat-icon class="text-yellow-400">format_list_bulleted</mat-icon>
            <span>Tất cả món</span>
        </button>

        <button *ngFor="let loai of loaiMonAnList" (click)="getMonAnTheoLoai(loai.MALOAIMONAN)"
            [class.bg-yellow-500]="selectedLoai === loai.MALOAIMONAN"
            class="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition-all duration-200 font-semibold">
            <mat-icon class="text-yellow-400">restaurant_menu</mat-icon>
            <span>{{ loai.TENLOAIMONAN }}</span>
        </button>
    </div>

    <!-- 🔹 Nội dung chính -->
    <div class="flex-1 flex overflow-hidden">
        <main class="flex-1 p-6 overflow-y-auto transition-all duration-300" [ngStyle]="{
    'margin-right': gioHang.length > 0 ? '26%' : '0',
    'padding-right': gioHang.length > 0 ? '1.5rem' : '0'
  }">
            <div class="flex justify-between items-center mb-6 pr-4">
                <!-- Thông tin bàn + nút chọn bàn -->
                <div class="flex items-center space-x-4">
                    <h2 class="text-xl font-bold text-yellow-400">
                        Bàn: <span class="text-white">{{ tenBan || 'Chưa chọn bàn' }}</span>
                    </h2>

                    <button mat-flat-button color="accent"
                        class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow transition"
                        (click)="openChonBan()">
                        <mat-icon>table_restaurant</mat-icon>
                        <span>{{ tenBan ? 'Đổi bàn' : 'Chọn bàn' }}</span>
                    </button>
                </div>

                <!-- Tiêu đề loại món ăn -->
                <h2 class="text-2xl font-bold text-yellow-400 pr-6">
                    {{ tieuDe }}
                </h2>
            </div>


            <!-- Danh sách món ăn -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <mat-card *ngFor="let mon of monAnList"
                    class="bg-gray-800 rounded-xl overflow-hidden shadow hover:scale-[1.03] transition-transform duration-200">
                    <img mat-card-image [src]="mon.ANH_MON_AN || 'assets/no-image.png'" alt="{{ mon.TEN_MON }}"
                        class="w-full h-40 object-cover" />
                    <mat-card-content class="p-4">
                        <h3 class="font-semibold text-lg text-gray-100">
                            {{ mon.TEN_MON }}
                        </h3>
                        <p class="text-yellow-400 font-bold">
                            {{ mon.GIA | number }} VND
                        </p>
                        <button mat-raised-button class="btn-dat-mon" (click)="addToGioHang(mon)">
                            🛒 Đặt món
                        </button>

                    </mat-card-content>
                </mat-card>
            </div>
        </main>

        <!-- 🛒 Giỏ hàng -->
        <aside *ngIf="gioHang.length > 0"
            class="fixed top-0 right-0 h-screen w-1/4 bg-gray-800 shadow-2xl border-l border-gray-700 p-4 overflow-y-auto z-50 transition-all duration-300">
            <h2 class="text-lg font-bold mb-4 text-yellow-400 border-b border-gray-700 pb-2">
                🛒 Giỏ hàng
            </h2>

            <div *ngFor="let item of gioHang"
                class="flex items-center justify-between mb-4 border-b border-gray-700 pb-2">
                <img [src]="item.ANH_MON_AN || 'assets/no-image.png'" alt="{{ item.TEN_MON }}"
                    class="w-12 h-12 rounded-lg object-cover" />
                <div class="flex-1 px-2">
                    <p class="font-semibold text-sm truncate">{{ item.TEN_MON }}</p>
                    <p class="text-yellow-400 text-xs">
                        {{ item.GIA | number }} VND
                    </p>
                </div>
                <div class="flex items-center gap-2">
                    <button mat-mini-fab (click)="giamSoLuong(item)" class="!h-6 !w-6 bg-gray-700 hover:bg-gray-600">
                        <mat-icon class="text-sm text-yellow-400">remove</mat-icon>
                    </button>
                    <span>{{ item.soLuong }}</span>
                    <button mat-mini-fab (click)="tangSoLuong(item)" class="!h-6 !w-6 bg-gray-700 hover:bg-gray-600">
                        <mat-icon class="text-sm text-yellow-400">add</mat-icon>
                    </button>
                </div>
                <button mat-icon-button color="warn" (click)="removeFromGioHang(item)">
                    <mat-icon class="text-red-500">delete</mat-icon>
                </button>
            </div>

            <div class="mt-4 border-t border-gray-700 pt-3 text-right">
                <p class="font-bold">
                    Tổng cộng:
                    <span class="text-yellow-400">{{ tongTien | number }} VND</span>
                </p>
                <div class="flex justify-end gap-2 mt-3">
                    <button mat-raised-button class="btn-goi-mon" (click)="goiMon()">
                        <mat-icon>check</mat-icon> Gọi món
                    </button>

                    <button mat-raised-button class="btn-huy-mon" (click)="huyGioHang()">
                        <mat-icon>close</mat-icon> Hủy
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- 🧃 Toast -->
    <app-toast-message [message]="toastMessage" [type]="toastType" [show]="showToast"
        class="fixed bottom-5 right-5 z-[9999]"></app-toast-message>
</div>
