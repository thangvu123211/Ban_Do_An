<div>
    <h2 class="text-lg font-semibold text-center mb-4  mt-4">Chọn bàn</h2>

    <div *ngIf="isLoading" class="flex justify-center items-center py-8">
        <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="!isLoading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8 ml-4 mt-4 mr-6">
        <div *ngFor="let table of BanAn" class="relative">
            <mat-card class="cursor-pointer hover:shadow-lg transition duration-200" (click)="selectTable(table.MA_BAN)"
                [ngClass]="selectedTableId === table.MA_BAN ? 'ring-4 ring-blue-500' : ''">
                <img mat-card-image
                    [src]="table.ANH_BAN || 'https://via.placeholder.com/300x200?text=Bàn+' + table.MA_BAN"
                    alt="Bàn {{ table.MA_BAN }}" class="rounded-lg h-48 w-full object-cover" />

                <div class="absolute top-2 right-2 px-2 py-1 rounded-full text-white text-xs"
                    [ngClass]="table.TRANGTHAI === 1 ? 'bg-green-500' : 'bg-red-500'">
                    {{ table.TRANGTHAI === 1 ? 'Còn chỗ' : 'Hết chỗ' }}
                </div>

                <div *ngIf="selectedTableId === table.MA_BAN"
                    class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-blue-600 text-white text-xs px-3 py-1 rounded-full shadow">
                    Đã chọn
                </div>

                <mat-card-content class="mt-2">
                    <div class="flex justify-between items-center">
                        <div class="flex flex-col text-sm text-gray-700 mt-2">
                            <span class="my-1">Số chỗ ngồi: {{ table.SO_CHO_NGOI }}</span>
                            <span>Tên bàn: {{ table.TENBAN }}</span>
                        </div>
                        <div [ngClass]="table.TRANGTHAI === 0 ? 'bg-red-500' : 'bg-green-500'"
                            class="w-3 h-3 rounded-full"></div>
                    </div>
                </mat-card-content>
            </mat-card>
        </div>
    </div>

    <div class="flex justify-end space-x-2">
        <button mat-stroked-button color="warn" (click)="closeDialog()">Hủy</button>
        <button mat-flat-button color="primary" (click)="confirmSelection()">Xác nhận</button>
    </div>
</div>
