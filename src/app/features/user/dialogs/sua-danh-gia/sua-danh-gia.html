<div class="bg-gray-50 flex items-center justify-center h-full p-4">
  <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-md w-full border border-gray-100">
    
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Sửa đánh giá</h2>
      <p class="text-sm text-gray-500 mt-1">Cập nhật lại trải nghiệm của bạn</p>
    </div>

    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <!-- ⭐ STAR -->
      <div class="flex flex-col items-center">
        <span class="text-sm font-medium text-gray-600 mb-2">Mức độ hài lòng</span>

        <div class="flex items-center space-x-1" (mouseleave)="onMouseLeave()">
          <button 
            type="button" 
            *ngFor="let star of stars"
            (mouseenter)="onMouseEnter(star)"
            (click)="selectRating(star)"
            class="hover:scale-110 transition-transform"
            [ngClass]="(hoverRating || currentRating) >= star ? 'text-amber-400' : 'text-gray-300'"
          >
            <svg class="w-9 h-9 fill-current" viewBox="0 0 24 24">
              <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
          </button>
        </div>

        <span class="text-xs text-amber-500 mt-2">
          {{ ratingText }}
        </span>
      </div>

      <!-- 📝 COMMENT -->
      <div>
        <textarea 
          formControlName="comment"
          rows="4"
          class="w-full px-4 py-3 border rounded-xl"
          placeholder="Nội dung đánh giá..."
        ></textarea>
      </div>

      <!-- BUTTON -->
      <button 
        type="submit" 
        class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-xl"
      >
        Cập nhật đánh giá
      </button>

    </form>

  </div>
</div>
