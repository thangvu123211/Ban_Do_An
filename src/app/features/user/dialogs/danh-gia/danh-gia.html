<div class="bg-gray-50 flex items-center justify-center h-full p-4">
  <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-md w-full border border-gray-100">
    
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Đánh giá trải nghiệm</h2>
      <p class="text-sm text-gray-500 mt-1">Ý kiến của bạn giúp chúng tôi cải tiến sản phẩm tốt hơn.</p>
    </div>

    <form [formGroup]="reviewForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div class="flex flex-col items-center">
        <span class="text-sm font-medium text-gray-600 mb-2">Mức độ hài lòng của bạn?</span>
        
        <div class="flex items-center space-x-1" (mouseleave)="onMouseLeave()">
          <button 
            type="button" 
            *ngFor="let star of stars"
            (mouseenter)="onMouseEnter(star)"
            (click)="selectRating(star)"
            class="hover:scale-110 transition-transform duration-150 focus:outline-none"
            [ngClass]="(hoverRating || currentRating) >= star ? 'text-amber-400' : 'text-gray-300'"
          >
            <svg class="w-9 h-9 fill-current" viewBox="0 0 24 24">
              <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
            </svg>
          </button>
        </div>
        
        <span class="text-xs font-semibold text-amber-500 mt-2 h-4">
          {{ ratingText }}
        </span>

        <p *ngIf="reviewForm.get('rating')?.touched && reviewForm.get('rating')?.invalid" class="text-xs text-red-500 mt-1">
          Vui lòng chọn số sao đánh giá.
        </p>
      </div>

      <div>
        <label for="comment" class="block text-sm font-medium text-gray-700 mb-1">
          Chia sẻ chi tiết về trải nghiệm của bạn
        </label>
        <textarea 
          id="comment" 
          formControlName="comment"
          rows="4" 
          class="w-full px-4 py-3 border rounded-xl text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 transition duration-150 ease-in-out resize-none"
          [ngClass]="reviewForm.get('comment')?.touched && reviewForm.get('comment')?.invalid 
            ? 'border-red-300 focus:ring-red-400 focus:border-red-400' 
            : 'border-gray-200 focus:ring-amber-400 focus:border-amber-400'"
          placeholder="Sản phẩm có tốt không? Giao hàng nhanh không? (Tối thiểu 10 ký tự)..."
        ></textarea>
        
        <div *ngIf="reviewForm.get('comment')?.touched && reviewForm.get('comment')?.invalid" class="text-xs text-red-500 mt-1">
          <span *ngIf="reviewForm.get('comment')?.errors?.['required']">Nội dung đánh giá không được để trống.</span>
          <span *ngIf="reviewForm.get('comment')?.errors?.['minlength']">Vui lòng nhập tối thiểu 10 ký tự.</span>
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full bg-amber-500 hover:bg-amber-600 text-white font-medium py-3 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-150 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2"
      >
        Gửi đánh giá
      </button>
    </form>

  </div>
</div>
