<div class="w-[380px] h-[600px] flex flex-col bg-white rounded-3xl overflow-hidden shadow-2xl">

  <!-- HEADER -->
  <div class="bg-gradient-to-r from-green-500 to-green-600 text-white p-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
        <mat-icon>smart_toy</mat-icon>
      </div>
      <div>
        <p class="font-semibold">Chat Bot Nhà hàng</p>
        <p class="text-xs text-green-100">Đang hoạt động</p>
      </div>
    </div>

    <button mat-icon-button (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- CHAT BODY -->
  <div class="flex-1 p-4 overflow-y-auto bg-gray-50 space-y-4">

    <!-- MESSAGE -->
    <div *ngFor="let msg of messages" class="flex items-end gap-2"
      [ngClass]="msg.from === 'user' ? 'justify-end' : 'justify-start'">

      <!-- BOT AVATAR -->
      <div *ngIf="msg.from === 'bot'"
        class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white text-sm">
        🤖
      </div>

      <!-- BUBBLE -->
      <div class="px-4 py-2 text-sm rounded-2xl max-w-[70%]" [ngClass]="msg.from === 'user'
          ? 'bg-green-500 text-white rounded-br-none'
          : 'bg-white text-gray-800 rounded-bl-none shadow'">

        <!-- TEXT -->
        <div *ngIf="msg.type === 'text'">
          {{ msg.message }}
        </div>

        <!-- FOOD LIST -->
        <!-- FOOD LIST -->
        <div *ngIf="msg.type === 'food_list'" class="space-y-2">

          <!-- MESSAGE GIỚI THIỆU -->
          <div *ngIf="msg.message" class="text-sm font-semibold text-gray-700 mb-2">
            {{ msg.message }}
          </div>

          <div *ngFor="let food of msg.foods" class="flex items-center gap-2 border rounded-lg p-2">

            <img [src]="food.anh_mon_an" class="w-12 h-12 rounded object-cover" />

            <div class="flex-1">
              <p class="font-semibold text-sm">{{ food.ten_mon_an }}</p>
              <p class="text-xs text-gray-500">{{ food.gia_tien | number }} đ</p>
            </div>

            <button (click)="addToGioHang(food)" class="text-xs bg-green-500 text-white px-2 py-1 rounded">
              +
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- BOT TYPING -->
    <div *ngIf="isTyping" class="flex items-end gap-2">
      <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white">
        🤖
      </div>

      <div class="bg-white px-4 py-2 rounded-2xl shadow text-gray-500 text-sm">
        Đang nhập...
      </div>
    </div>

  </div>

  <!-- INPUT -->
  <div class="p-3 border-t bg-white flex gap-2">
    <input [(ngModel)]="input" (keydown.enter)="send()" placeholder="Nhập tin nhắn..." class="flex-1 px-4 py-2 border rounded-full outline-none
         focus:ring-2 focus:ring-green-400" />

    <button (click)="send()" class="bg-green-500 text-white px-4 py-2 rounded-full">
      Gửi
    </button>
  </div>

</div>

  <app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>
