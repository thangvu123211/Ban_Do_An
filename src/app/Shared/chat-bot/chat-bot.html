<div
  class="w-[380px] h-[600px] flex flex-col bg-slate-50 rounded-[2rem] overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.15)] border border-slate-100/50">

  <!-- HEADER: Thiết kế Gradient Emerald sâu, hiện đại hơn -->
  <div
    class="bg-gradient-to-br from-emerald-600 via-emerald-500 to-teal-600 text-white p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-3">
      <div
        class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center border border-white/10 shadow-inner">
        <mat-icon class="text-white">smart_toy</mat-icon>
      </div>
      <div>
        <p class="font-semibold tracking-wide text-sm">Trợ Lý Ẩm Thực</p>
        <div class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span>
          <p class="text-xs text-emerald-100 font-medium">Sẵn sàng phục vụ</p>
        </div>
      </div>
    </div>

    <button mat-icon-button (click)="close()" class="hover:bg-white/10 rounded-full transition-colors">
      <mat-icon class="text-white/80">close</mat-icon>
    </button>
  </div>

  <!-- CHAT BODY: Thay đổi nền mịn hơn -->
  <div class="flex-1 p-4 overflow-y-auto bg-gradient-to-b from-slate-50 to-slate-100 space-y-4 scrollbar-thin">

    <!-- MESSAGE LOOP -->
    <div *ngFor="let msg of messages" class="flex items-end gap-2.5"
      [ngClass]="msg.from === 'user' ? 'justify-end' : 'justify-start'">

      <!-- BOT AVATAR -->
      <div *ngIf="msg.from === 'bot'"
        class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md">

        <span class="grid place-items-center w-5 h-5">
          <mat-icon class="!m-0 !p-0 text-[18px] w-[18px] h-[18px] flex items-center justify-center leading-none">
            smart_toy
          </mat-icon>
        </span>

      </div>

      <!-- BUBBLE: Bo góc thông minh, đổ bóng mịn -->
      <div class="px-4 py-2.5 text-sm rounded-2xl max-w-[75%] transition-all duration-200" [ngClass]="msg.from === 'user'
          ? 'bg-gradient-to-r from-emerald-500 to-teal-500 text-white rounded-br-none shadow-md shadow-emerald-500/10'
          : 'bg-white text-slate-800 rounded-bl-none shadow-sm border border-slate-100'">

        <!-- TEXT -->
        <div *ngIf="msg.type === 'text'" [innerHTML]="msg.message" class="leading-relaxed">
          <!-- {{ msg.message }} -->
        </div>

        <!-- FOOD LIST UI MỚI -->
        <div *ngIf="msg.type === 'food_list'" class="space-y-2.5 mt-1">

          <!-- MESSAGE GIỚI THIỆU -->
          <div *ngIf="msg.message"
            class="text-xs font-semibold text-emerald-800 bg-emerald-50 px-2 py-1 rounded-md mb-2 inline-block">
            {{ msg.message }}
          </div>

          <!-- FOOD ITEM CARD -->
          <div *ngFor="let food of msg.foods"
            class="flex items-center gap-3 bg-slate-50 hover:bg-slate-100/80 border border-slate-100 rounded-xl p-2 transition-all duration-200 group">

            <div class="relative overflow-hidden rounded-lg w-14 h-14 shadow-sm">
              <img [src]="food.anh_mon_an"
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            </div>

            <div class="flex-1 min-w-0">
              <p class="font-medium text-slate-800 text-xs truncate">{{ food.ten_mon_an }}</p>
              <p class="text-xs font-bold text-teal-600 mt-0.5">{{ food.gia_tien | number }} đ</p>
            </div>

            <button
              class="w-7 h-7 flex items-center justify-center text-xs font-bold bg-emerald-50 text-emerald-600 hover:bg-emerald-500 hover:text-white rounded-lg shadow-sm border border-emerald-100 transition-all active:scale-95">
              +
            </button>
          </div>
        </div>

      </div>
    </div>

    <!-- BOT TYPING EFFECT -->
    <div *ngIf="isTyping" class="flex items-end gap-2.5">
      <div
        class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md">

        <span class="grid place-items-center w-5 h-5">
          <mat-icon class="!m-0 !p-0 text-[18px] w-[18px] h-[18px] flex items-center justify-center leading-none">
            smart_toy
          </mat-icon>
        </span>

      </div>
      <div
        class="bg-white px-4 py-2.5 rounded-2xl rounded-bl-none shadow-sm border border-slate-100 text-slate-400 text-xs flex items-center gap-1.5 font-medium">
        <span class="flex h-1.5 w-1.5 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-emerald-500"></span>
        </span>
        Đang chuẩn bị câu trả lời...
      </div>
    </div>

  </div>

  <!-- INPUT AREA: Thanh nhập liệu sang xịn mịn -->
  <div class="p-3 bg-white border-t border-slate-100 flex gap-2.5 items-center shadow-[0_-5px_15px_rgba(0,0,0,0.02)]">
    <input [(ngModel)]="input" (keydown.enter)="send()" placeholder="Hỏi gì đó về món ăn..."
      class="flex-1 px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-full outline-none transition-all focus:border-emerald-400 focus:bg-white focus:ring-4 focus:ring-emerald-500/10 text-slate-700" />

    <button (click)="send()"
      class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white px-5 py-2.5 text-sm font-medium rounded-full shadow-md shadow-emerald-500/20 active:scale-95 transition-all">
      Gửi
    </button>
  </div>

</div>

<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type"></app-toast-message>
