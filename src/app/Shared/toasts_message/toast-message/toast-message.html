<div 
  *ngIf="show" 
  class="fixed top-32 right-4 flex items-center gap-3 text-white p-4 rounded-lg shadow-lg animate-fadeIn z-[9999]"
  [ngClass]="bgColor">
  <mat-icon>{{ icon }}</mat-icon>
  <span class="font-medium">{{ message }}</span>
  <button class="ml-auto text-white font-bold" (click)="close()">✖</button>
</div>
