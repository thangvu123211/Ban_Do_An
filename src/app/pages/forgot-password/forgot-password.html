<div class="flex items-center justify-center min-h-screen bg-gray-50">

  <div class="flex w-[900px] rounded-3xl shadow-xl overflow-hidden bg-white">

    <!-- LEFT -->
    <div class="w-1/2 bg-gradient-to-b from-green-600 to-green-500
                flex flex-col justify-center items-center text-white p-10">

      <h1 class="text-3xl font-bold leading-snug mb-4 text-center">
        Khôi phục <br />
        mật khẩu <br />
        <span class="underline decoration-white">an toàn & nhanh chóng</span>
      </h1>

      <p class="text-sm text-center text-green-50 mb-6">
        Hệ thống sẽ gửi mã OTP đến email của bạn để xác minh.
      </p>

      <img src="assets/Logo/TA.png" class="w-40" />
    </div>

    <!-- RIGHT -->
    <div class="w-1/2 flex flex-col justify-center px-10 py-12 bg-white">

      <h2 class="text-2xl font-bold text-gray-900 mb-2">
        Quên mật khẩu
      </h2>

      <p class="text-sm text-gray-500 mb-6">
        Nhập thông tin để đặt lại mật khẩu
      </p>

      <!-- STEP 1 -->
      <div *ngIf="step === 1" class="flex flex-col gap-4">

        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="email" type="email" autocomplete="off" name="email_fake">
        </mat-form-field>

        <button (click)="sendOtp()" [disabled]="loadingSendOtp" class="w-full py-3 bg-green-600 text-white rounded-xl
         hover:bg-green-700 transition
         flex items-center justify-center gap-2
         disabled:opacity-60 disabled:cursor-not-allowed">

          <ng-container *ngIf="!loadingSendOtp">
            Gửi mã OTP
          </ng-container>

          <ng-container *ngIf="loadingSendOtp">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
              </path>
            </svg>
            Đang gửi...
          </ng-container>

        </button>

        <p class="text-sm text-center text-gray-500 mt-2 cursor-pointer hover:underline" (click)="goToLogin()">
          ← Quay lại đăng nhập
        </p>
      </div>

      <!-- STEP 2 -->
      <div *ngIf="step === 2" class="flex flex-col gap-4">

        <p class="text-sm text-gray-500">
          OTP đã gửi đến: <b>{{ email }}</b>
        </p>

        <mat-form-field appearance="outline">
          <mat-label>OTP</mat-label>
          <input matInput [(ngModel)]="otp" autocomplete="one-time-code" name="otp_code">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Mật khẩu mới</mat-label>
          <input matInput type="password" [(ngModel)]="newPassword" autocomplete="new-password"
            name="new_password_fake">
        </mat-form-field>

        <button (click)="resetPassword()"
          class="w-full py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 transition">
          Đổi mật khẩu
        </button>

        <button (click)="step = 1" class="text-sm text-gray-500 hover:underline">
          ← Nhập lại email
        </button>
      </div>

    </div>
  </div>
</div>
<app-toast-message [show]="toast.show" [message]="toast.message" [type]="toast.type">
</app-toast-message>
